<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Circle Geometry Board</title>
	<style>
		:root {
			--bg: #f5f8ff;
			--panel: #ffffff;
			--ink: #122247;
			--muted: #526595;
			--line: rgba(68, 113, 194, 0.3);
			--main: #0d3273;
			--accent: #4471c2;
			--pink: #ea8fb5;
			--green: #2c8d56;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 10% 10%, rgba(68, 113, 194, 0.14) 0, rgba(68, 113, 194, 0) 38%),
				radial-gradient(circle at 90% 8%, rgba(232, 160, 191, 0.16) 0, rgba(232, 160, 191, 0) 36%),
				var(--bg);
			padding: 0.58rem;
		}

		body.night_mode {
			--bg: #171f39;
			--panel: #1f2a4a;
			--ink: #edf2ff;
			--muted: #c2d0f5;
			--line: rgba(168, 188, 239, 0.26);
			--main: #86a7ff;
			--accent: #aac1ff;
			--pink: #f0aecf;
			--green: #9bd5b8;
		}

		.board_shell {
			height: 100%;
			min-height: 100%;
			border: 1px solid var(--line);
			background: var(--panel);
			display: grid;
			grid-template-rows: auto 1fr auto auto;
		}

		.board_head {
			padding: 0.62rem 0.8rem 0.56rem;
			border-bottom: 1px dashed var(--line);
			display: grid;
			gap: 0.24rem;
		}

		.chip {
			font-size: 0.74rem;
			font-weight: 800;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: var(--accent);
		}

		.board_head h2 {
			font-size: 1.12rem;
			letter-spacing: 0.01em;
		}

		.subtitle {
			font-size: 0.86rem;
			color: var(--muted);
		}

		.diagram_wrap {
			padding: 0.45rem 0.7rem 0.36rem;
			display: grid;
			align-items: stretch;
			justify-items: stretch;
			min-width: 0;
			min-height: 0;
		}

		.geogebra_wrap {
			display: grid;
			gap: 0.4rem;
			min-width: 0;
			min-height: 0;
		}

		#ggb-element {
			width: 100%;
			height: 100%;
			min-width: 0;
			min-height: 0;
			border: 1px solid var(--line);
			background: #ffffff;
			overflow: hidden;
		}

		#ggb-status {
			font-size: 0.82rem;
			color: var(--muted);
			padding: 0 0.12rem;
		}

		#ggb-status.error {
			color: #ca3f67;
		}

		.formula_strip {
			padding: 0.18rem 0.7rem 0.44rem;
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 0.5rem;
		}

		.formula_card {
			border: 1px solid var(--line);
			padding: 0.5rem 0.55rem;
			display: grid;
			gap: 0.16rem;
		}

		.formula_card span {
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--muted);
		}

		.formula_card strong {
			font-size: 0.9rem;
		}

		.legend {
			padding: 0.06rem 0.7rem 0.56rem;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 0.42rem 0.8rem;
		}

		.legend_item {
			display: flex;
			align-items: center;
			gap: 0.45rem;
			font-size: 0.84rem;
			color: var(--muted);
		}

		.legend_mark {
			width: 18px;
			height: 4px;
		}

		.mark_radius { background: var(--accent); }
		.mark_diameter { background: var(--main); }
		.mark_chord { background: var(--pink); }
		.mark_tangent { background: var(--green); }

		@media (max-width: 760px) {
			body {
				padding: 0.42rem;
			}

			.board_shell {
				min-height: 100%;
			}

			.formula_strip,
			.legend {
				grid-template-columns: 1fr;
			}

			#ggb-element {
				min-height: 0;
			}
		}
	</style>
</head>
<body>
	<section class="board_shell" aria-label="Circle geometry board">
		<header class="board_head">
			<p class="chip" data-key="chip">独立图示</p>
			<h2 data-key="title">GeoGebra 圆几何交互控件</h2>
			<p class="subtitle" data-key="subtitle">课堂展示模式：仅保留核心交互，弦 FG 与直径 DE 已明确分离展示。</p>
		</header>

		<div class="diagram_wrap" aria-label="GeoGebra interactive circle board">
			<div class="geogebra_wrap">
				<div id="ggb-element"></div>
				<p id="ggb-status" data-key="status_loading">正在加载 GeoGebra 交互控件...</p>
			</div>
		</div>

		<div class="formula_strip" aria-label="key formulas">
			<article class="formula_card">
				<span data-key="f1_label">面积</span>
				<strong>A = πr²</strong>
			</article>
			<article class="formula_card">
				<span data-key="f2_label">周长</span>
				<strong>C = 2πr</strong>
			</article>
			<article class="formula_card">
				<span data-key="f3_label">直径</span>
				<strong>d = 2r</strong>
			</article>
		</div>

		<div class="legend" aria-label="diagram legend">
			<div class="legend_item"><span class="legend_mark mark_radius"></span><span data-key="legend_radius">半径 OA / OB</span></div>
			<div class="legend_item"><span class="legend_mark mark_diameter"></span><span data-key="legend_diameter">直径 DE（经过圆心）</span></div>
			<div class="legend_item"><span class="legend_mark mark_chord"></span><span data-key="legend_chord">弦 FG（不经过圆心）</span></div>
			<div class="legend_item"><span class="legend_mark mark_tangent"></span><span data-key="legend_tangent">切线经过点 B</span></div>
		</div>
	</section>

	<script src="https://cdn.geogebra.org/apps/deployggb.js"></script>
	<script>
		const i18n = {
			zh: {
				chip: "独立图示",
				title: "GeoGebra 圆几何交互控件",
				subtitle: "课堂展示模式：仅保留核心交互，弦 FG 与直径 DE 已明确分离展示。",
				status_loading: "正在加载 GeoGebra 交互控件...",
				status_error: "GeoGebra 加载失败，请检查网络后刷新页面。",
				f1_label: "面积",
				f2_label: "周长",
				f3_label: "直径",
				legend_radius: "半径 OA / OB",
				legend_diameter: "直径 DE（经过圆心）",
				legend_chord: "弦 FG（不经过圆心）",
				legend_tangent: "切线经过点 B"
			},
			en: {
				chip: "Standalone Visual",
				title: "GeoGebra Circle Geometry Widget",
				subtitle: "Classroom mode keeps only essential interactions, with chord FG clearly separated from diameter DE.",
				status_loading: "Loading GeoGebra interactive widget...",
				status_error: "GeoGebra failed to load. Please check your network and refresh.",
				f1_label: "Area",
				f2_label: "Circumference",
				f3_label: "Diameter",
				legend_radius: "Radius OA / OB",
				legend_diameter: "Diameter DE (through center)",
				legend_chord: "Chord FG (off-center)",
				legend_tangent: "Tangent through point B"
			}
		};

		const state = {
			locale: "zh",
			night: false
		};

		let current_applet_locale = "";

		function get_dict() {
			return i18n[state.locale] || i18n.zh;
		}

		function get_applet_language() {
			return state.locale === "en" ? "en" : "zh-CN";
		}

		function apply_locale(locale) {
			state.locale = locale === "en" ? "en" : "zh";
			const dict = get_dict();
			document.documentElement.lang = state.locale === "en" ? "en" : "zh-CN";
			document.querySelectorAll("[data-key]").forEach((el) => {
				const key = el.getAttribute("data-key");
				if (dict[key]) {
					el.textContent = dict[key];
				}
			});
		}

		function apply_night_mode(is_night) {
			state.night = Boolean(is_night);
			document.body.classList.toggle("night_mode", state.night);
		}

		function show_status_error() {
			const dict = get_dict();
			const status = document.getElementById("ggb-status");
			status.textContent = dict.status_error;
			status.classList.add("error");
			status.hidden = false;
		}

		function get_applet_size() {
			const host = document.getElementById("ggb-element");
			const box = host.getBoundingClientRect();
			const width = Math.floor(box.width || 760);
			const height = Math.floor(box.height || 430);
			return { width, height };
		}

		function seed_circle_scene(api, size) {
			if (typeof api.setErrorDialogsActive === "function") {
				api.setErrorDialogsActive(false);
			}

			const base_commands = [
				"O=(0,0)",
				"c=Circle(O,5)",
				"D=Point(c)",
				"A=D",
				"E=Rotate(D,180°,O)",
				"B=Point(c)",
				"F=Point(c)",
				"G=Rotate(F,70°,O)",
				"radius1=Segment(O,A)",
				"radius2=Segment(O,B)",
				"diameter=Segment(D,E)",
				"chord=Segment(F,G)"
			];

			base_commands.forEach((cmd) => {
				const ok = api.evalCommand(cmd);
				if (!ok) {
					throw new Error(`GeoGebra command failed: ${cmd}`);
				}
			});

			const sector_ok = api.evalCommand("sector=Sector(c,A,B)") || api.evalCommand("sector=CircularSector(O,A,B)");
			if (!sector_ok) {
				throw new Error("GeoGebra sector command failed");
			}

			const tangent_ok = api.evalCommand("tangentB=PerpendicularLine(B,Line(O,B))") || api.evalCommand("tangentB=Tangent(B,c)");
			if (!tangent_ok) {
				throw new Error("GeoGebra tangent command failed");
			}

			const colors = {
				radius1: [68, 113, 194],
				radius2: [68, 113, 194],
				diameter: [13, 50, 115],
				chord: [234, 143, 181],
				tangentB: [44, 141, 86],
				sector: [232, 160, 191]
			};

			if (typeof api.setColor === "function") {
				Object.entries(colors).forEach(([name, color]) => {
					api.setColor(name, color[0], color[1], color[2]);
				});
			}

			if (typeof api.setLineStyle === "function") {
				api.setLineStyle("diameter", 2);
				api.setLineStyle("chord", 0);
			}

			if (typeof api.setLineThickness === "function") {
				api.setLineThickness("diameter", 5);
				api.setLineThickness("chord", 6);
				api.setLineThickness("radius1", 4);
				api.setLineThickness("radius2", 4);
			}

			if (typeof api.setFilling === "function") {
				api.setFilling("sector", 0.42);
			}

			if (typeof api.setPointSize === "function") {
				["O", "A", "B", "D", "E", "F", "G"].forEach((point_name) => {
					api.setPointSize(point_name, 5);
				});
			}

			if (typeof api.setLabelVisible === "function") {
				api.setLabelVisible("diameter", true);
				api.setLabelVisible("chord", true);
			}

			if (typeof api.setCaption === "function") {
				const diameter_caption = state.locale === "en" ? "Diameter DE" : "直径 DE";
				const chord_caption = state.locale === "en" ? "Chord FG" : "弦 FG";
				api.setCaption("diameter", diameter_caption);
				api.setCaption("chord", chord_caption);
			}

			if (typeof api.setLabelStyle === "function") {
				api.setLabelStyle("diameter", 2);
				api.setLabelStyle("chord", 2);
			}

			if (typeof api.setAxesVisible === "function") {
				api.setAxesVisible(1, false, false);
			}

			if (typeof api.setGridVisible === "function") {
				api.setGridVisible(1, true);
			}

			if (typeof api.setCoordSystem === "function") {
				const safe_width = Math.max(1, size.width);
				const safe_height = Math.max(1, size.height);
				const x_span = 20;
				const y_span = x_span * (safe_height / safe_width);
				api.setCoordSystem(-10, 10, -y_span / 2, y_span / 2);
			}
		}

		function mount_geogebra(force_reload) {
			if (typeof window.GGBApplet !== "function") {
				show_status_error();
				return;
			}

			if (!force_reload && current_applet_locale === state.locale) {
				return;
			}

			const host = document.getElementById("ggb-element");
			const status = document.getElementById("ggb-status");
			const dict = get_dict();
			const size = get_applet_size();

			host.innerHTML = "";
			status.hidden = false;
			status.classList.remove("error");
			status.textContent = dict.status_loading;

			const parameters = {
				appName: "classic",
				perspective: "G",
				width: size.width,
				height: size.height,
				showToolBar: false,
				showToolBarHelp: false,
				showAlgebraInput: false,
				showAlgebraView: false,
				showMenuBar: false,
				showResetIcon: true,
				enableLabelDrags: true,
				enableShiftDragZoom: true,
				enableRightClick: false,
				showZoomButtons: false,
				enableUndoRedo: false,
				language: get_applet_language(),
				appletOnLoad: function(api) {
					try {
						if (typeof api.setPerspective === "function") {
							api.setPerspective("G");
						}
						seed_circle_scene(api, size);
						current_applet_locale = state.locale;
						status.hidden = true;
					} catch (error) {
						console.error(error);
						show_status_error();
					}
				}
			};

			const applet = new window.GGBApplet(parameters, true);
			applet.inject("ggb-element");
		}

		window.addEventListener("message", (event) => {
			const data = event.data;
			if (!data || data.type !== "circlab_state") {
				return;
			}

			const next_locale = data.locale === "en" ? "en" : "zh";
			const locale_changed = next_locale !== state.locale;

			apply_night_mode(data.night);
			apply_locale(next_locale);

			if (locale_changed) {
				mount_geogebra(true);
			}
		});

		window.addEventListener("load", () => {
			apply_locale("zh");
			mount_geogebra(true);

			let resize_timer;
			const wrap = document.getElementById("ggb-element");
			const observer = new ResizeObserver(() => {
				clearTimeout(resize_timer);
				resize_timer = setTimeout(() => {
					if (window.ggbApplet && typeof window.ggbApplet.setSize === "function") {
						const box = wrap.getBoundingClientRect();
						const width = Math.floor(box.width);
						const height = Math.floor(box.height);
						window.ggbApplet.setSize(width > 0 ? width : 320, height > 0 ? height : 360);
					}
				}, 150);
			});
			if(wrap) observer.observe(wrap);
		});
	</script>
</body>
</html>
