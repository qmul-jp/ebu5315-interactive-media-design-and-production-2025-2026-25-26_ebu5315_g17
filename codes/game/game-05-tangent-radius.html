                <div class="content">
                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>
                    </div>

                    <div class="controls">

                    <div class="theorem">

                    </div>

    <script>
        // ==================== 切线半径垂直定理画布逻辑 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        // 圆心 O 与半径
        const cx = 270, cy = 220;
        const radius = 120;
        let angle = Math.PI / 4;

        let isDragging = false;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 适配夜间模式颜色
            const isDark = document.body.classList.contains('night_mode');
            const strokeColor = isDark ? '#e5e7eb' : '#333';
            const fillColor = isDark ? '#e5e7eb' : '#000';

            // 切点 A
            const ax = cx + radius * Math.cos(angle);
            const ay = cy + radius * Math.sin(angle);

            // 画圆
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 圆心 O
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.font = '16px Arial';
            ctx.fillStyle = fillColor;
            ctx.fillText('O', cx - 15, cy - 10);

            // 半径 OA —— 实线
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(ax, ay);
            ctx.strokeStyle = fillColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([]);
            ctx.stroke();

            // 切线 —— 虚线
            const nx = -Math.sin(angle);
            const ny = Math.cos(angle);
            const len = 400;
            ctx.beginPath();
            ctx.moveTo(ax - nx * len, ay - ny * len);
            ctx.lineTo(ax + nx * len, ay + ny * len);
            ctx.strokeStyle = fillColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 切点 A
            ctx.beginPath();
            ctx.arc(ax, ay, 6, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();

            // 字母 A 放在点旁边
            ctx.font = '16px Arial';
            ctx.fillStyle = fillColor;
            ctx.fillText('A', ax + 8, ay - 8);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            const ax = cx + radius * Math.cos(angle);
            const ay = cy + radius * Math.sin(angle);
            const dx = pos.x - ax;
            const dy = pos.y - ay;
            if (Math.hypot(dx, dy) < 20) {
                isDragging = true;
            }
        });

        // 鼠标移动时检测是否在点A上，切换为手掌光标
        window.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            const ax = cx + radius * Math.cos(angle);
            const ay = cy + radius * Math.sin(angle);
            const dx = pos.x - ax;
            const dy = pos.y - ay;
            
            // 鼠标悬停在点A上 → 手掌样式
            if (Math.hypot(dx, dy) < 20) {
                canvas.style.cursor = 'pointer';
            } else {
                canvas.style.cursor = 'default';
            }

            if (!isDragging) return;
            angle = Math.atan2(pos.y - cy, pos.x - cx);
            draw();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        resetBtn.addEventListener('click', () => {
            angle = Math.PI / 4;
            draw();
        });

        // 初始化
        draw();
    </script>
