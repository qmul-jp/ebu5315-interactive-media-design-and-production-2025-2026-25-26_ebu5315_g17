<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - 切线半径垂直定理 | CircleLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 - 完全对齐game-03页面 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a;
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            /* 动画通用配置 */
            --animate-duration: 0.4s;
            --animate-ease: ease-out;
        }

        /* 导航栏入场动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* 统一夜间模式 */
        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            padding: 0.95rem 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* ====================== 顶部导航栏 ====================== */
        .navbar {
            position: sticky;
            top: 0.95rem;
            z-index: 40;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.55rem;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* ====================== 左侧边栏 ====================== */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            height: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(13, 50, 115, 0.15);
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-stroke;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem transparent;
            border-bottom: 0.38rem transparent;
            border-right: 0.38rem #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
            transform: none;
        }

        .side_nav_link:hover .side_nav_tooltip,
        .side_nav_link:focus-visible .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* ====================== 主内容适配布局 ====================== */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        /* ====================== 页面核心样式 ====================== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 24px 20px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 191, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .card p, .card li {
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .card ul {
            padding-left: 20px;
        }

        /* 画布区域样式 */
        .canvas-wrapper {
            position: relative;
            text-align: center;
            margin-top: 24px;
            padding: 16px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
        }

        .reset-btn {
            position: absolute;
            left: 10px;
            bottom: 10px;
            padding: 6px 12px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .canvas-tip {
            margin-top: 12px;
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.4;
        }

        /* 夜间模式兼容卡片 */
        body.dark-mode .card-def {
            background: #162349;
            color: var(--text_color_night);
        }
        body.dark-mode .card-theorem {
            background: #14293f;
            color: var(--text_color_night);
        }
        body.dark-mode .card-corollary {
            background: #2c2442;
            color: var(--text_color_night);
        }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip {
            color: var(--text_color_night);
        }

        /* 响应式适配 */
        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                align-items: center;
                justify-items: stretch;
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏（与03完全一致） -->
    <nav class="navbar">
        <a href="../index.html" class="logo">CircleLab</a>
        <div class="nav-buttons">
            <button class="lang-toggle" id="langToggleBtn">English</button>
            <button class="theme-toggle" id="themeToggleBtn">🌙 夜间模式</button>
        </div>
    </nav>

    <!-- 左侧边栏（与03完全一致，游戏页激活） -->
    <aside class="side_nav" aria-label="Primary menu">
        <a class="side_nav_link" href="../index.html" aria-label="Homepage">
            <span class="side_nav_icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3L21 10.5"></path><path d="M5 9.5V20H19V9.5"></path><path d="M10 20V14H14V20"></path></svg></span>
            <span class="side_nav_tooltip" data-zh="主页" data-en="Homepage">主页</span>
        </a>
        <a class="side_nav_link" href="../quiz/quiz.html" aria-label="Quiz">
            <span class="side_nav_icon"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"></rect><path d="M9 4.5H15"></path><path d="M9 10H15"></path><path d="M9 14H13"></path><path d="M9 18H12"></path><path d="M14 14L15.5 15.5L18 13"></path></svg></span>
            <span class="side_nav_tooltip" data-zh="测验" data-en="Quiz">测验</span>
        </a>
        <a class="side_nav_link active" href="./game.html" aria-label="Game">
            <span class="side_nav_icon"><svg viewBox="0 0 24 24"><path d="M7 10H17A4 4 0 0 1 20.8 15L20 18.2A1.8 1.8 0 0 1 17.1 19.2L14.8 17.5H9.2L6.9 19.2A1.8 1.8 0 0 1 4 18.2L3.2 15A4 4 0 0 1 7 10Z"></path><path d="M8.5 13.5V16.5"></path><path d="M7 15H10"></path><circle cx="15.5" cy="14.5" r="0.8" fill="currentColor"></circle><circle cx="17.8" cy="16.2" r="0.8" fill="currentColor"></circle></svg></span>
            <span class="side_nav_tooltip" data-zh="游戏" data-en="Game">游戏</span>
        </a>
    </aside>

    <!-- 主内容区域（布局与03完全一致） -->
    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h1 data-zh="05 - 切线半径垂直定理" data-en="05 - Tangent Perpendicular to Radius Theorem"></h1>
            </div>

            <div class="content">
                <!-- 定理内容（双语适配） -->
                <div class="card card-def">
                    <h3 data-zh="📘 基本定义" data-en="📘 Definition"></h3>
                    <p data-zh="圆的切线是指与圆只有唯一公共点的直线，该公共点称为切点。" data-en="A tangent to a circle is a line that intersects the circle at exactly one point, called the point of tangency."></p>
                </div>

                <div class="card card-theorem">
                    <h3 data-zh="📐 定理内容" data-en="📐 Theorem"></h3>
                    <p data-zh="在任意一个圆中：" data-en="In any circle:"></p>
                    <ul>
                        <li data-zh="圆的切线垂直于过切点的半径。" data-en="The tangent to a circle is perpendicular to the radius at the point of tangency."></li>
                    </ul>
                </div>

                <div class="card card-corollary">
                    <h3 data-zh="📌 重要推论" data-en="📌 Corollary"></h3>
                    <p data-zh="经过圆心且垂直于切线的直线必经过切点；经过切点且垂直于切线的直线必经过圆心。" data-en="The line perpendicular to the tangent at the point of contact passes through the center of the circle."></p>
                </div>

                <!-- 交互式图形区域（完全保留原有功能） -->
                <div class="canvas-wrapper">
                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>
                        <button class="reset-btn" id="resetBtn" data-zh="重置" data-en="Reset"></button>
                    </div>
                    <p class="canvas-tip" data-zh="🔹 拖动切点 A 即可移动切线，半径 OA 始终与切线保持垂直" data-en="🔹 Drag point A to move the tangent, OA is always perpendicular to tangent"></p>
                </div>
            </div>
        </div>
    </div>

<script>
    // ====================== 统一语言/主题逻辑 ======================
    let isChinese = true;
    const langBtn = document.getElementById('langToggleBtn');
    const themeBtn = document.getElementById('themeToggleBtn');
    
    // 初始化默认中文
    function initLang() {
        const i18nElements = document.querySelectorAll('[data-zh][data-en]');
        i18nElements.forEach(el => {
            el.textContent = el.dataset.zh;
        });
        langBtn.textContent = "English";
        updateThemeBtnText();
    }

    // 语言切换
    function toggleLang() {
        isChinese = !isChinese;
        const i18nElements = document.querySelectorAll('[data-zh][data-en]');
        i18nElements.forEach(el => {
            el.textContent = isChinese ? el.dataset.zh : el.dataset.en;
        });
        langBtn.textContent = isChinese ? "English" : "中文";
        updateThemeBtnText();
        draw();
    }

    // 主题切换
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        updateThemeBtnText();
        draw();
    }

    // 更新主题按钮文字
    function updateThemeBtnText() {
        const isDark = document.body.classList.contains('dark-mode');
        themeBtn.textContent = isChinese 
            ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
            : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
    }

    // 绑定事件
    langBtn.addEventListener('click', toggleLang);
    themeBtn.addEventListener('click', toggleTheme);
    window.addEventListener('DOMContentLoaded', initLang);

    // ====================== 切线半径定理 画布交互（原有功能完整保留） ======================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('resetBtn');

    // 圆心 O 与半径
    const cx = 270, cy = 220;
    const radius = 120;
    let angle = Math.PI / 4;

    let isDragging = false;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 适配夜间模式颜色
        const isDark = document.body.classList.contains('dark-mode');
        const strokeColor = isDark ? '#e5e7eb' : '#333';
        const fillColor = isDark ? '#e5e7eb' : '#000';

        // 切点 A
        const ax = cx + radius * Math.cos(angle);
        const ay = cy + radius * Math.sin(angle);

        // 画圆
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        // 圆心 O
        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fillStyle = fillColor;
        ctx.fill();
        ctx.font = '16px Arial';
        ctx.fillStyle = fillColor;
        ctx.fillText('O', cx - 15, cy - 10);

        // 半径 OA —— 实线
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(ax, ay);
        ctx.strokeStyle = fillColor;
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.stroke();

        // 切线 —— 虚线
        const nx = -Math.sin(angle);
        const ny = Math.cos(angle);
        const len = 400;
        ctx.beginPath();
        ctx.moveTo(ax - nx * len, ay - ny * len);
        ctx.lineTo(ax + nx * len, ay + ny * len);
        ctx.strokeStyle = fillColor;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 切点 A
        ctx.beginPath();
        ctx.arc(ax, ay, 6, 0, Math.PI * 2);
        ctx.fillStyle = fillColor;
        ctx.fill();

        // 字母 A 放在点旁边
        ctx.font = '16px Arial';
        ctx.fillStyle = fillColor;
        ctx.fillText('A', ax + 8, ay - 8);
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    canvas.addEventListener('mousedown', (e) => {
        const pos = getMousePos(e);
        const ax = cx + radius * Math.cos(angle);
        const ay = cy + radius * Math.sin(angle);
        const dx = pos.x - ax;
        const dy = pos.y - ay;
        if (Math.hypot(dx, dy) < 20) {
            isDragging = true;
        }
    });

    // 【核心修改】鼠标移动时检测是否在点A上，切换为手掌光标
    window.addEventListener('mousemove', (e) => {
        const pos = getMousePos(e);
        const ax = cx + radius * Math.cos(angle);
        const ay = cy + radius * Math.sin(angle);
        const dx = pos.x - ax;
        const dy = pos.y - ay;
        
        // 鼠标悬停在点A上 → 手掌样式
        if (Math.hypot(dx, dy) < 20) {
            canvas.style.cursor = 'pointer';
        } else {
            canvas.style.cursor = 'default';
        }

        if (!isDragging) return;
        angle = Math.atan2(pos.y - cy, pos.x - cx);
        draw();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    resetBtn.addEventListener('click', () => {
        angle = Math.PI / 4;
        draw();
    });

    // 初始化绘制
    draw();
</script>
</body>
</html>
