        <main class="content_area">
            <div class="container">
                <div class="header">
                    <h1>
                        <span class="zh">06 - 切线长定理</span>
                        <span class="en">06 - Tangent Length Theorem</span>
                    </h1>
                </div>

                <div class="content">
                    <div class="canvas-container">
                        <canvas id="geometryCanvas" width="540" height="440"></canvas>
                    </div>

                    <div class="controls">
                        <button id="resetBtn" class="btn">重置</button>
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" id="showRightAngleCheck" checked>
                                <span class="zh">显示直角标记</span>
                                <span class="en">Show Right Angle</span>
                            </label>
                            <label>
                                <input type="checkbox" id="showChordCheck">
                                <span class="zh">显示弦</span>
                                <span class="en">Show Chord</span>
                            </label>
                        </div>
                    </div>

                    <div class="info">
                        <div class="angle-info">
                            <p>PA = PB: <span id="tangentLength">1.581</span></p>
                            <p>OP: <span id="opLength">2.5</span></p>
                        </div>
                        <div class="angle-info">
                            <p>∠APB: <span id="angleAPB">36.9</span>°</p>
                            <p>∠AOB: <span id="angleAOB">143.1</span>°</p>
                        </div>
                    </div>

                    <div class="theorem">
                        <h2>切线长定理</h2>
                        <p>从圆外一点引圆的两条切线，它们的切线长相等。</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        
        const tangentSpan = document.getElementById('tangentLength');
        const opSpan = document.getElementById('opLength');
        const angleAPBSpan = document.getElementById('angleAPB');
        const angleAOBSpan = document.getElementById('angleAOB');
        
        const showRightAngleCheck = document.getElementById('showRightAngleCheck');
        const showChordCheck = document.getElementById('showChordCheck');

        // ---------- 全局变量 ----------
        const scale = 110;            
        const O = { x: 440, y: 200 };
        const r = 1;                 
        const rDraw = r * scale;
        
        let P = { x: O.x + 2.5 * scale, y: O.y };
        let isDragging = false;

        let showRightAngle = true;
        let showChord = false;

        // ---------- 辅助函数 ----------
        function clampP() {
            P.x = Math.max(10, Math.min(canvas.width - 10, P.x));
            P.y = Math.max(10, Math.min(canvas.height - 10, P.y));
            const dx = P.x - O.x;
            const dy = P.y - O.y;
            const d = Math.hypot(dx, dy);
            const minDist = rDraw + 15;
            if (d < minDist) {
                P.x = O.x + (dx / d) * minDist;
                P.y = O.y + (dy / d) * minDist;
            }
        }

        function getGeometry() {
            const dx = P.x - O.x;
            const dy = P.y - O.y;
            const opPixels = Math.hypot(dx, dy);
            const op = opPixels / scale;
            
            const tangent = Math.sqrt(Math.max(0, op * op - r * r));
            const theta = Math.atan2(dy, dx);
            const halfAngle = Math.acos(r / op);
            
            const angleAPB_rad = 2 * Math.asin(r / op);
            const angleAOB_rad = 2 * Math.acos(r / op);
            
            const A = {
                x: O.x + rDraw * Math.cos(theta - halfAngle),
                y: O.y + rDraw * Math.sin(theta - halfAngle)
            };
            const B = {
                x: O.x + rDraw * Math.cos(theta + halfAngle),
                y: O.y + rDraw * Math.sin(theta + halfAngle)
            };
            
            return { 
                A, B, tangent, op, opPixels,
                angleAPB: angleAPB_rad * 180 / Math.PI,
                angleAOB: angleAOB_rad * 180 / Math.PI
            };
        }

        // 绘制直角符号 (在切点处)
        function drawRightAngleMark(pt, center, size = 16) {
            const dx = pt.x - center.x;
            const dy = pt.y - center.y;
            const len = Math.hypot(dx, dy);
            if (len < 0.1) return;
            
            const ux = dx / len;
            const uy = dy / len;
            const vx = -uy;
            const vy = ux;
            
            const p1 = { x: pt.x - ux * size, y: pt.y - uy * size };
            const p2 = { x: pt.x + vx * size, y: pt.y + vy * size };
            const p3 = { x: pt.x - ux * size + vx * size, y: pt.y - uy * size + vy * size };
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = 2.2;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const geo = getGeometry();
            const { A, B, tangent, op, angleAPB, angleAOB } = geo;
            
            const isDark = document.body.classList.contains('night_mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            const lineColor = isDark ? '#cbd5e1' : '#475569';
            
            // 半径
            ctx.beginPath();
            ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y);
            ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 切线 (虚线)
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(P.x, P.y); ctx.lineTo(A.x, A.y);
            ctx.moveTo(P.x, P.y); ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 圆
            ctx.beginPath();
            ctx.arc(O.x, O.y, rDraw, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 弦 AB (可选)
            if (showChord) {
                ctx.beginPath();
                ctx.moveTo(A.x, A.y);
                ctx.lineTo(B.x, B.y);
                ctx.strokeStyle = isDark ? '#e8a0bf' : '#b45389';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // 连线 OP
            ctx.beginPath();
            ctx.moveTo(O.x, O.y);
            ctx.lineTo(P.x, P.y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 直角标记 (可选)
            if (showRightAngle) {
                ctx.save();
                ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
                ctx.fillStyle = ctx.strokeStyle;
                drawRightAngleMark(A, O, 16);
                drawRightAngleMark(B, O, 16);
                ctx.restore();
            }
            
            // 绘制点
            const drawPoint = (pt, radius, label, offsetX = 12, offsetY = 6) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(label, pt.x + offsetX, pt.y + offsetY);
            };
            
            drawPoint(O, 5, 'O', 12, 6);
            drawPoint(P, 7, 'P', 12, 6);
            drawPoint(A, 5, 'A', 12, 6);
            drawPoint(B, 5, 'B', 12, 6);
            
            // 更新数据
            tangentSpan.textContent = tangent.toFixed(3);
            opSpan.textContent = op.toFixed(3);
            angleAPBSpan.textContent = angleAPB.toFixed(1);
            angleAOBSpan.textContent = angleAOB.toFixed(1);
        }

        // ---------- 交互事件 ----------
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            if (Math.hypot(mouseX - P.x, mouseY - P.y) < 20) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            if (isDragging) {
                P.x = mouseX;
                P.y = mouseY;
                clampP();
                draw();
                e.preventDefault();
            } else {
                canvas.style.cursor = Math.hypot(mouseX - P.x, mouseY - P.y) < 20 ? 'grab' : 'default';
            }
        }

        function handleMouseUp(e) {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;
            
            if (Math.hypot(touchX - P.x, touchY - P.y) < 25) {
                isDragging = true;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;
            
            P.x = touchX;
            P.y = touchY;
            clampP();
            draw();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            isDragging = false;
            draw();
        }

        function resetToDefault() {
            P = { x: O.x + 2.5 * scale, y: O.y };
            draw();
        }

        // ---------- 绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            
            resetBtn.addEventListener('click', resetToDefault);
            
            showRightAngleCheck.addEventListener('change', (e) => {
                showRightAngle = e.target.checked;
                draw();
            });
            showChordCheck.addEventListener('change', (e) => {
                showChord = e.target.checked;
                draw();
            });
            
            window.addEventListener('resize', () => draw());
        }

        // 启动
        bindEvents();
        draw();
    })();
    </script>
