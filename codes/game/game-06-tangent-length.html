<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>06 · 切线长定理 | CircleLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 + 响应式基础变量 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a;
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            --animate-duration: 0.4s;
            --animate-ease: ease-out;
            --base-padding: 1.5rem;
            --base-font: 15px;
            --title-font: 24px;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            padding: calc(var(--header_height) + var(--base-padding)) 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
            font-size: var(--base-font);
        }

        /* 导航栏 - 固定定位 */
        .navbar {
            position: fixed;
            top: 0.95rem;
            left: 1rem;
            right: 1rem;
            z-index: 999;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* 侧边栏 */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            bottom: 2rem;
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.24);
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem solid transparent;
            border-bottom: 0.38rem solid transparent;
            border-right: 0.38rem solid #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
        }

        .side_nav_link:hover .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* 主内容 */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: var(--title-font);
            font-weight: 600;
        }

        .content {
            padding: 32px 24px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            line-height: 1.6;
            transition: background-color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 191, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card p, .card li {
            font-size: var(--base-font);
            color: var(--text_secondary);
        }

        .canvas-wrapper {
            margin-top: 48px;
            padding: 24px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
            max-width: 100%;
            height: auto !important;
            display: block;
            margin: 0 auto;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }

        .control-left {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text_secondary);
            cursor: pointer;
        }

        .control-check input {
            width: 18px;
            height: 18px;
            accent-color: var(--sub_color);
            cursor: pointer;
        }

        .reset-btn {
            padding: 6px 14px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .data-panel {
            position: absolute;
            right: 16px;
            top: 16px;
            text-align: left;
            font-size: 15px;
            padding: 14px 18px;
            background: var(--card_bg);
            border-radius: 8px;
            box-shadow: var(--shadow_sm);
            border: 1px solid var(--border_light);
            color: var(--text_secondary);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .data-panel .blue { color: var(--sub_color); font-weight: 600; }
        .data-panel .green { color: var(--highlight_color); font-weight: 600; }
        .data-panel hr { margin: 8px 0; border: 0.5px solid var(--border_light); }

        .canvas-tip {
            margin-top: 16px;
            font-size: var(--base-font);
            color: var(--text_secondary);
            text-align: center;
        }

        body.dark-mode .card-def { background: #162349; }
        body.dark-mode .card-theorem { background: #14293f; }
        body.dark-mode .card-corollary { background: #2c2442; }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip,
        body.dark-mode .data-panel { color: var(--text_color_night); }

        /* ====================== 响应式适配 ====================== */
        /* 平板/横屏手机 */
        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
                color: #fff;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        /* 手机端 */
        @media (max-width: 768px) {
            :root {
                --header_height: 60px;
                --base-padding: 1rem;
                --title-font: 20px;
            }

            /* 顶部导航适配 */
            .navbar {
                padding: 0 0.8rem;
                top: 0.5rem;
                left: 0.5rem;
                right: 0.5rem;
            }
            .logo {
                font-size: 1.4rem;
            }
            .logo::before {
                width: 1.8rem;
                height: 1.8rem;
                font-size: 1rem;
            }
            .lang-toggle, .theme-toggle {
                padding: 0.4rem 0.6rem;
                font-size: 12px;
                min-height: 32px;
            }

            /* 内容区域适配 */
            .content {
                padding: 20px 16px;
            }
            .card h3 {
                font-size: 18px;
            }
            .canvas-wrapper {
                padding: 16px;
                margin-top: 32px;
            }

            /* 数据面板：移动端转为下方居中 */
            .data-panel {
                position: static;
                margin: 16px auto 0;
                text-align: center;
                max-width: 280px;
            }

            /* 控制栏垂直排列 */
            .control-bar {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .control-left {
                justify-content: center;
                width: 100%;
            }
        }

        /* 超小屏手机 */
        @media (max-width: 480px) {
            :root {
                --header_height: 52px;
                --base-font: 14px;
                --title-font: 18px;
            }

            .nav-buttons {
                gap: 0.3rem;
            }
            .content {
                padding: 16px 12px;
            }
            .canvas-tip {
                font-size: 13px;
            }
            .control-left {
                gap: 12px;
            }
        }
    </style>
</head>

        <div class="container">
            <div class="header">
                <h1>
                    <span data-zh="06 · 切线长定理" data-en="06 · Tangent Length Theorem"></span>
                </h1>
            </div>

            <div class="content">
                <div class="card card-def">
                    <h3><span data-zh="📘 基本定义" data-en="📘 Definition"></span></h3>
                    <p data-zh="从圆外一点向圆作切线，该点与切点之间的线段长度，叫做这点到圆的切线长。" 
                       data-en="The length of the segment from an external point to the point of tangency is called the tangent length."></p>
                </div>
                <div class="card card-theorem">
                    <h3><span data-zh="📐 定理内容" data-en="📐 Theorem"></span></h3>
                    <p data-zh="<strong>在任意一个圆中：</strong>" data-en="<strong>In any circle:</strong>"></p>
                    <ul>
                        <li data-zh="从圆外一点引圆的两条切线，它们的切线长相等。" 
                            data-en="The two tangent segments from a single external point to a circle are equal in length."></li>
                    </ul>
                </div>
                <div class="card card-corollary">
                    <h3><span data-zh="📌 重要推论" data-en="📌 Corollary"></span></h3>
                    <p data-zh="圆心与圆外一点的连线，平分这一点所引的两条切线的夹角，并且垂直平分两条切点的连线。" 
                       data-en="The line from the center to an external point bisects the angle between the two tangents and is the perpendicular bisector of the chord joining the points of contact."></p>
                </div>

                <div class="canvas-wrapper">
                    <div class="canvas-container">
                        <canvas id="geometryCanvas" width="880" height="400"></canvas>
                        
                        <div class="data-panel">
                            <div class="blue"><span data-zh="PA = PB = " data-en="PA = PB = "></span><span id="tangentLength">0.000</span></div>
                            <div><span data-zh="OP = " data-en="OP = "></span><span id="opLength">0.000</span></div>
                            <hr>
                            <div class="green"><span data-zh="∠APB = " data-en="∠APB = "></span><span id="angleAPB">0.0</span>°</div>
                            <div class="green"><span data-zh="∠AOB = " data-en="∠AOB = "></span><span id="angleAOB">0.0</span>°</div>
                        </div>

                        <div class="control-bar">
                            <div class="control-left">
                                <label class="control-check">
                                    <input type="checkbox" id="showRightAngleCheck" checked> 
                                    <span data-zh="显示直角标记" data-en="Show right angle"></span>
                                </label>
                                <label class="control-check">
                                    <input type="checkbox" id="showChordCheck"> 
                                    <span data-zh="显示弦 AB" data-en="Show chord AB"></span>
                                </label>
                            </div>
                            <button class="reset-btn" id="resetBtn">
                                <span data-zh="↻ 重置图形" data-en="↻ Reset"></span>
                            </button>
                        </div>
                    </div>
                    <p class="canvas-tip" data-zh="🔹 拖动点 P 观察切线长、角度变化 · 直角标记和弦 AB 可开关" 
                       data-en="🔹 Drag point P · Toggle right angle marks and chord AB"></p>
                </div>
            </div>
        </div>

<script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        const langBtn = document.getElementById('langToggleBtn');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        const tangentSpan = document.getElementById('tangentLength');
        const opSpan = document.getElementById('opLength');
        const angleAPBSpan = document.getElementById('angleAPB');
        const angleAOBSpan = document.getElementById('angleAOB');
        
        const showRightAngleCheck = document.getElementById('showRightAngleCheck');
        const showChordCheck = document.getElementById('showChordCheck');

        // ---------- 全局变量 ----------
        let isChinese = true;
        const scale = 110;            
        const O = { x: 440, y: 200 };
        const r = 1;                 
        const rDraw = r * scale;
        
        let P = { x: O.x + 2.5 * scale, y: O.y };
        let isDragging = false;

        let showRightAngle = true;
        let showChord = false;

        // ---------- 辅助函数 ----------
        function clampP() {
            P.x = Math.max(10, Math.min(canvas.width - 10, P.x));
            P.y = Math.max(10, Math.min(canvas.height - 10, P.y));
            const dx = P.x - O.x;
            const dy = P.y - O.y;
            const d = Math.hypot(dx, dy);
            const minDist = rDraw + 15;
            if (d < minDist) {
                P.x = O.x + (dx / d) * minDist;
                P.y = O.y + (dy / d) * minDist;
            }
        }

        function getGeometry() {
            const dx = P.x - O.x;
            const dy = P.y - O.y;
            const opPixels = Math.hypot(dx, dy);
            const op = opPixels / scale;
            
            const tangent = Math.sqrt(Math.max(0, op * op - r * r));
            const theta = Math.atan2(dy, dx);
            const halfAngle = Math.acos(r / op);
            
            const angleAPB_rad = 2 * Math.asin(r / op);
            const angleAOB_rad = 2 * Math.acos(r / op);
            
            const A = {
                x: O.x + rDraw * Math.cos(theta - halfAngle),
                y: O.y + rDraw * Math.sin(theta - halfAngle)
            };
            const B = {
                x: O.x + rDraw * Math.cos(theta + halfAngle),
                y: O.y + rDraw * Math.sin(theta + halfAngle)
            };
            
            return { 
                A, B, tangent, op, opPixels,
                angleAPB: angleAPB_rad * 180 / Math.PI,
                angleAOB: angleAOB_rad * 180 / Math.PI
            };
        }

        // 绘制直角符号 (在切点处)
        function drawRightAngleMark(pt, center, size = 16) {
            const dx = pt.x - center.x;
            const dy = pt.y - center.y;
            const len = Math.hypot(dx, dy);
            if (len < 0.1) return;
            
            const ux = dx / len;
            const uy = dy / len;
            const vx = -uy;
            const vy = ux;
            
            const p1 = { x: pt.x - ux * size, y: pt.y - uy * size };
            const p2 = { x: pt.x + vx * size, y: pt.y + vy * size };
            const p3 = { x: pt.x - ux * size + vx * size, y: pt.y - uy * size + vy * size };
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = 2.2;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const geo = getGeometry();
            const { A, B, tangent, op, angleAPB, angleAOB } = geo;
            
            const isDark = document.body.classList.contains('dark-mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            const lineColor = isDark ? '#cbd5e1' : '#475569';
            
            // 半径
            ctx.beginPath();
            ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y);
            ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 切线 (虚线)
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(P.x, P.y); ctx.lineTo(A.x, A.y);
            ctx.moveTo(P.x, P.y); ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 圆
            ctx.beginPath();
            ctx.arc(O.x, O.y, rDraw, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 弦 AB (可选)
            if (showChord) {
                ctx.beginPath();
                ctx.moveTo(A.x, A.y);
                ctx.lineTo(B.x, B.y);
                ctx.strokeStyle = isDark ? '#e8a0bf' : '#b45389';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // 连线 OP
            ctx.beginPath();
            ctx.moveTo(O.x, O.y);
            ctx.lineTo(P.x, P.y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 直角标记 (可选)
            if (showRightAngle) {
                ctx.save();
                ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
                ctx.fillStyle = ctx.strokeStyle;
                drawRightAngleMark(A, O, 16);
                drawRightAngleMark(B, O, 16);
                ctx.restore();
            }
            
            // 绘制点
            const drawPoint = (pt, radius, label, offsetX = 12, offsetY = 6) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(label, pt.x + offsetX, pt.y + offsetY);
            };
            
            drawPoint(O, 5, 'O', 12, 6);
            drawPoint(P, 7, 'P', 12, 6);
            drawPoint(A, 5, 'A', 12, 6);
            drawPoint(B, 5, 'B', 12, 6);
            
            // 更新数据
            tangentSpan.textContent = tangent.toFixed(3);
            opSpan.textContent = op.toFixed(3);
            angleAPBSpan.textContent = angleAPB.toFixed(1);
            angleAOBSpan.textContent = angleAOB.toFixed(1);
        }

        // ---------- 语言/主题 ----------
        function applyLanguage() {
            const i18nElements = document.querySelectorAll('[data-zh][data-en]');
            i18nElements.forEach(el => {
                el.textContent = isChinese ? el.dataset.zh : el.dataset.en;
            });
            langBtn.textContent = isChinese ? "English" : "中文";
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isChinese 
                ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
                : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
        }

        function toggleLanguage() {
            isChinese = !isChinese;
            applyLanguage();
            draw();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            updateThemeButtonText();
            draw();
        }

        // ---------- 交互事件 ----------
        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            if (Math.hypot(mouseX - P.x, mouseY - P.y) < 20) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            if (isDragging) {
                P.x = mouseX;
                P.y = mouseY;
                clampP();
                draw();
                e.preventDefault();
            } else {
                canvas.style.cursor = Math.hypot(mouseX - P.x, mouseY - P.y) < 20 ? 'grab' : 'default';
            }
        }

        function handleMouseUp(e) {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;
            
            if (Math.hypot(touchX - P.x, touchY - P.y) < 25) {
                isDragging = true;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;
            
            P.x = touchX;
            P.y = touchY;
            clampP();
            draw();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            isDragging = false;
            draw();
        }

        function resetToDefault() {
            P = { x: O.x + 2.5 * scale, y: O.y };
            draw();
        }

        // ---------- 绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            
            resetBtn.addEventListener('click', resetToDefault);
            langBtn.addEventListener('click', toggleLanguage);
            themeBtn.addEventListener('click', toggleTheme);
            
            showRightAngleCheck.addEventListener('change', (e) => {
                showRightAngle = e.target.checked;
                draw();
            });
            showChordCheck.addEventListener('change', (e) => {
                showChord = e.target.checked;
                draw();
            });
            
            window.addEventListener('resize', () => draw());
        }

        // 启动
        applyLanguage();
        bindEvents();
        draw();
    })();
</script>
	<script src="../colorblind.js"></script>
</body>
</html>
