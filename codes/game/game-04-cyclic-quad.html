<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>04 · 圆内接四边形定理 | CircleLab</title>
    <link rel="stylesheet" href="../auth-entry.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 — 与整体风格完全对齐 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a;
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            --animate-duration: 0.4s;
            --animate-ease: ease-out;
        }

        /* 入场动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* 夜间模式变量覆盖 */
        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            padding: 0.95rem 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* ====================== 顶部导航栏 ====================== */
        .navbar {
            position: sticky;
            top: 0.95rem;
            z-index: 40;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.55rem;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* ====================== 左侧边栏 ====================== */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            bottom: 2rem;
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.24);
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-stroke;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem solid transparent;
            border-bottom: 0.38rem solid transparent;
            border-right: 0.38rem solid #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
            transform: none;
        }

        .side_nav_link:hover .side_nav_tooltip,
        .side_nav_link:focus-visible .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* ====================== 主内容适配布局 ====================== */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        /* 页面卡片样式 */
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 24px 20px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 194, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .card p, .card li {
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .card ul {
            padding-left: 20px;
        }

        /* 画布区域 */
        .canvas-wrapper {
            position: relative;
            text-align: center;
            margin-top: 24px;
            padding: 16px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
            display: block;
        }

        .reset-btn {
            position: absolute;
            left: 10px;
            bottom: 10px;
            padding: 6px 12px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            font-weight: 600;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .data-panel {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translate(30px, -50%);
            text-align: left;
            font-size: 15px;
            line-height: 1.8;
            min-width: 200px;
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text_secondary);
            pointer-events: none;
        }
        .data-panel .blue { 
            color: var(--sub_color); 
            font-weight: 600; 
        }
        .data-panel .green {
            color: var(--highlight_color);
            font-weight: 600;
        }

        .canvas-tip {
            margin-top: 12px;
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.4;
        }

        /* 夜间模式卡片微调 */
        body.dark-mode .card-def {
            background: #162349;
            color: var(--text_color_night);
        }
        body.dark-mode .card-theorem {
            background: #14293f;
            color: var(--text_color_night);
        }
        body.dark-mode .card-corollary {
            background: #2c2442;
            color: var(--text_color_night);
        }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip,
        body.dark-mode .data-panel {
            color: var(--text_color_night);
        }

        /* 响应式适配 */
        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                align-items: center;
                justify-items: stretch;
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
                color: #fff;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .data-panel {
                position: static;
                transform: none;
                margin-top: 16px;
                text-align: center;
            }
            .canvas-container {
                width: 100%;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

                    <ul>
                        <li data-zh="圆内接四边形的对角互补，即对角之和等于 180°" 
                            data-en="The opposite angles of a cyclic quadrilateral are supplementary, summing to 180°."></li>
                    </ul>

                <!-- 推论卡片 -->
                <div class="card card-corollary">
                    <h3><span data-zh="📌 重要推论" data-en="📌 Corollary"></span></h3>
                    <p data-zh="如果一个四边形的一组对角互补，那么这个四边形内接于一个圆。" 
                       data-en="If a pair of opposite angles of a quadrilateral are supplementary, the quadrilateral is cyclic."></p>
                </div>

                <!-- 交互画布区 -->

                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>

                            <div class="blue"><span data-zh="∠DAB：" data-en="∠DAB："></span><span id="angA">0</span>°</div>
                            <div class="blue"><span data-zh="∠ABC：" data-en="∠ABC："></span><span id="angB">0</span>°</div>
                            <div class="blue"><span data-zh="∠BCD：" data-en="∠BCD："></span><span id="angC">0</span>°</div>
                            <div class="blue"><span data-zh="∠CDA：" data-en="∠CDA："></span><span id="angD">0</span>°</div>
                            <br>
                            <div class="green"><span data-zh="∠DAB + ∠BCD = " data-en="∠DAB + ∠BCD = "></span><span id="sum1">180</span>°</div>
                            <div class="green"><span data-zh="∠ABC + ∠CDA = " data-en="∠ABC + ∠CDA = "></span><span id="sum2">180</span>°</div>

    <script>
        (function(){
            "use strict";

            // ---------- 国际化 & 主题 ----------
            let isChinese = true;
            const langBtn = document.getElementById('langToggleBtn');
            const themeBtn = document.getElementById('themeToggleBtn');
            
            function applyLanguage() {
                const i18nElements = document.querySelectorAll('[data-zh][data-en]');
                i18nElements.forEach(el => {
                    el.textContent = isChinese ? el.dataset.zh : el.dataset.en;
                });
                langBtn.textContent = isChinese ? "English" : "中文";
                updateThemeButtonText();
            }

            function updateThemeButtonText() {
                const isDark = document.body.classList.contains('dark-mode');
                themeBtn.textContent = isChinese 
                    ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
                    : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
            }

            function toggleLanguage() {
                isChinese = !isChinese;
                applyLanguage();
                draw();
            }

            function toggleTheme() {
                document.body.classList.toggle('dark-mode');
                updateThemeButtonText();
                draw();
            }

            langBtn.addEventListener('click', toggleLanguage);
            themeBtn.addEventListener('click', toggleTheme);
            
            applyLanguage();

            // ---------- 画布与几何参数 ----------
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const resetBtn = document.getElementById('resetBtn');
            
            const cx = 270, cy = 220;
            const radius = 160;
            const LABEL_OFFSET = 24;          // 标签向外偏移量
            
            // 初始角度 (顺时针顺序 A-B-C-D，构成圆内接四边形)
            const initialAngles = {
                A: 5 * Math.PI / 4,    // 左下
                B: 7 * Math.PI / 4,    // 右下
                C: Math.PI / 4,        // 右上
                D: 3 * Math.PI / 4     // 左上
            };

            let points = { ...initialAngles };
            let dragging = null;
            let hoverPoint = null;

            // ---------- 辅助函数：角度转坐标 ----------
            function getPosition(angle) {
                return {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                };
            }

            // 标签坐标 (沿径向向外)
            function getLabelPosition(angle, offset = LABEL_OFFSET) {
                const dirX = Math.cos(angle);
                const dirY = Math.sin(angle);
                return {
                    x: cx + (radius + offset) * dirX,
                    y: cy + (radius + offset) * dirY
                };
            }

            // 计算顶点处的内角 (M为顶点，P、Q为相邻两点)
            function angleAtVertex(M, P, Q) {
                const m = getPosition(points[M]);
                const p = getPosition(points[P]);
                const q = getPosition(points[Q]);
                const v1 = { x: p.x - m.x, y: p.y - m.y };
                const v2 = { x: q.x - m.x, y: q.y - m.y };
                const dot = v1.x * v2.x + v1.y * v2.y;
                const mag1 = Math.hypot(v1.x, v1.y);
                const mag2 = Math.hypot(v2.x, v2.y);
                if (mag1 === 0 || mag2 === 0) return 0;
                const cos = Math.max(-1, Math.min(1, dot / (mag1 * mag2)));
                return Math.acos(cos) * 180 / Math.PI;
            }

            // 计算所有内角
            function calculateAngles() {
                const DAB = angleAtVertex('A', 'D', 'B');
                const ABC = angleAtVertex('B', 'A', 'C');
                const BCD = angleAtVertex('C', 'B', 'D');
                const CDA = angleAtVertex('D', 'C', 'A');
                return {
                    DAB: Math.round(DAB),
                    ABC: Math.round(ABC),
                    BCD: Math.round(BCD),
                    CDA: Math.round(CDA)
                };
            }

            // ---------- 绘制对角互补的弧线标记 (增强视觉效果) ----------
            function drawAngleArc(centerAngle, startAngle, endAngle, color, clockwise = true) {
                const arcRadius = 36;
                const start = {
                    x: cx + arcRadius * Math.cos(startAngle),
                    y: cy + arcRadius * Math.sin(startAngle)
                };
                ctx.beginPath();
                ctx.arc(cx, cy, arcRadius, startAngle, endAngle, !clockwise);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.2;
                ctx.setLineDash([4, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 主绘制函数
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const isDark = document.body.classList.contains('dark-mode');
                const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
                const fillColor = isDark ? '#f8fafc' : '#0f172a';
                const dashColor = isDark ? '#94a3b8' : '#64748b';
                const lineColor = isDark ? '#cbd5e1' : '#475569';
                
                // 绘制圆
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.2;
                ctx.stroke();
                
                // 绘制两条虚线直径 (辅助参考)
                ctx.save();
                ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.moveTo(cx - radius, cy);
                ctx.lineTo(cx + radius, cy);
                ctx.strokeStyle = dashColor;
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy - radius);
                ctx.lineTo(cx, cy + radius);
                ctx.stroke();
                ctx.restore();
                
                // 圆心
                ctx.beginPath();
                ctx.arc(cx, cy, 4.5, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.font = '500 14px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText('O', cx + 12, cy - 8);
                
                // 获取四个点坐标
                const pos = {
                    A: getPosition(points.A),
                    B: getPosition(points.B),
                    C: getPosition(points.C),
                    D: getPosition(points.D)
                };
                
                // 绘制四边形
                ctx.beginPath();
                ctx.moveTo(pos.A.x, pos.A.y);
                ctx.lineTo(pos.B.x, pos.B.y);
                ctx.lineTo(pos.C.x, pos.C.y);
                ctx.lineTo(pos.D.x, pos.D.y);
                ctx.closePath();
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2.0;
                ctx.stroke();
                
                // 绘制对角互补的弧线 (用柔和颜色)
                const angles = calculateAngles();
                const sum1 = angles.DAB + angles.BCD;
                const sum2 = angles.ABC + angles.CDA;
                
                // 如果和接近180°，绘制两条短弧表示对角互补
                if (Math.abs(sum1 - 180) < 1) {
                    drawAngleArc(points.A, points.D, points.B, '#e8a0bf', true);
                    drawAngleArc(points.C, points.B, points.D, '#e8a0bf', true);
                }
                if (Math.abs(sum2 - 180) < 1) {
                    drawAngleArc(points.B, points.A, points.C, '#88aadd', true);
                    drawAngleArc(points.D, points.C, points.A, '#88aadd', true);
                }
                
                // 绘制顶点标记 (圆点)
                const keys = ['A', 'B', 'C', 'D'];
                keys.forEach(k => {
                    const p = pos[k];
                    ctx.beginPath();
                    const pointRadius = (hoverPoint === k) ? 9 : 7;
                    ctx.arc(p.x, p.y, pointRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = fillColor;
                    ctx.shadowColor = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                
                // 标签绘制在圆外侧 (沿径向偏移)
                keys.forEach(k => {
                    const angle = points[k];
                    const labelPos = getLabelPosition(angle);
                    ctx.font = 'bold 17px "Segoe UI", "Trebuchet MS", sans-serif';
                    ctx.fillStyle = fillColor;
                    ctx.fillText(k, labelPos.x, labelPos.y);
                });
                
                // 更新数据面板
                document.getElementById('angA').textContent = angles.DAB;
                document.getElementById('angB').textContent = angles.ABC;
                document.getElementById('angC').textContent = angles.BCD;
                document.getElementById('angD').textContent = angles.CDA;
                document.getElementById('sum1').textContent = angles.DAB + angles.BCD;
                document.getElementById('sum2').textContent = angles.ABC + angles.CDA;
            }

            // ---------- 鼠标/触摸交互 ----------
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function hitTest(mx, my) {
                const threshold = 24;
                for (let k of ['A', 'B', 'C', 'D']) {
                    const p = getPosition(points[k]);
                    const dist = Math.hypot(mx - p.x, my - p.y);
                    if (dist < threshold) return k;
                }
                return null;
            }

            function onDragStart(e) {
                e.preventDefault();
                const coord = getCanvasCoords(e);
                dragging = hitTest(coord.x, coord.y);
                if (dragging) {
                    canvas.style.cursor = 'grabbing';
                }
            }

            function onDragMove(e) {
                if (!dragging) {
                    const coord = getCanvasCoords(e);
                    hoverPoint = hitTest(coord.x, coord.y);
                    canvas.style.cursor = hoverPoint ? 'grab' : 'default';
                    draw();
                    return;
                }
                e.preventDefault();
                const coord = getCanvasCoords(e);
                let angle = Math.atan2(coord.y - cy, coord.x - cx);
                points[dragging] = angle;
                draw();
            }

            function onDragEnd(e) {
                if (dragging) {
                    dragging = null;
                    canvas.style.cursor = 'default';
                    draw();
                }
            }

            function onMouseLeave() {
                hoverPoint = null;
                if (!dragging) canvas.style.cursor = 'default';
                draw();
            }

            function resetPoints() {
                points = { ...initialAngles };
                draw();
            }

            // 事件绑定
            canvas.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            canvas.addEventListener('mouseleave', onMouseLeave);
            
            canvas.addEventListener('touchstart', onDragStart, { passive: false });
            canvas.addEventListener('touchmove', onDragMove, { passive: false });
            canvas.addEventListener('touchend', onDragEnd);
            canvas.addEventListener('touchcancel', onDragEnd);
            
            resetBtn.addEventListener('click', resetPoints);
            
            window.addEventListener('resize', () => draw());
            
            // 初始化绘制
            draw();
        })();
    </script>
	<script src="../auth-entry.js"></script>
	<script src="../colorblind.js"></script>
</body>
