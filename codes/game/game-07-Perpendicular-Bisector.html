<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>07 · 垂径定理 | CircleLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a;
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            --animate-duration: 0.4s;
            --animate-ease: ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            /* 修正顶部内边距，防止被固定导航栏遮挡 */
            padding: calc(var(--header_height) + 1.5rem) 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* 导航栏 - 固定定位 */
        .navbar {
            position: fixed;
            top: 0.95rem;
            left: 1rem;
            right: 1rem;
            z-index: 999;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* 侧边栏 - 保持固定不变 */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            bottom: 2rem;
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.24);
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem solid transparent;
            border-bottom: 0.38rem solid transparent;
            border-right: 0.38rem solid #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
        }

        .side_nav_link:hover .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* 主内容 */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 32px 24px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            line-height: 1.6;
            transition: background-color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 191, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card p, .card li {
            font-size: 15px;
            color: var(--text_secondary);
        }

        .canvas-wrapper {
            margin-top: 48px;
            padding: 24px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
            max-width: 100%;
            height: auto;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }

        .control-left {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text_secondary);
            cursor: pointer;
        }

        .control-check input {
            width: 18px;
            height: 18px;
            accent-color: var(--sub_color);
            cursor: pointer;
        }

        .reset-btn {
            padding: 6px 14px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .data-panel {
            position: absolute;
            right: 16px;
            top: 16px;
            text-align: left;
            font-size: 15px;
            padding: 14px 18px;
            background: var(--card_bg);
            border-radius: 8px;
            box-shadow: var(--shadow_sm);
            border: 1px solid var(--border_light);
            color: var(--text_secondary);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .data-panel .blue { color: var(--sub_color); font-weight: 600; }
        .data-panel .green { color: var(--highlight_color); font-weight: 600; }
        .data-panel hr { margin: 8px 0; border: 0.5px solid var(--border_light); }

        .canvas-tip {
            margin-top: 16px;
            font-size: 15px;
            color: var(--text_secondary);
        }

        body.dark-mode .card-def { background: #162349; }
        body.dark-mode .card-theorem { background: #14293f; }
        body.dark-mode .card-corollary { background: #2c2442; }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip,
        body.dark-mode .data-panel { color: var(--text_color_night); }

        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
                color: #fff;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .data-panel {
                position: static;
                margin-top: 16px;
                text-align: center;
            }
            .control-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

                <h1>
                    <span data-zh="07 · 垂径定理" data-en="07 · Perpendicular Chord Bisector Theorem"></span>
                </h1>
            </div>

            <div class="content">
                <div class="card card-def">
                    <h3><span data-zh="📘 基本定义" data-en="📘 Definition"></span></h3>
                    <p data-zh="垂直于弦的直径平分弦，并且平分弦所对的两条弧，这条直径所在的直线叫做圆的垂径。" 
                       data-en="The diameter perpendicular to a chord bisects the chord and the arcs subtended by the chord."></p>
                </div>
                <div class="card card-theorem">
                    <h3><span data-zh="📐 定理内容" data-en="📐 Theorem"></span></h3>
                    <p data-zh="<strong>在任意一个圆中：</strong>" data-en="<strong>In any circle:</strong>"></p>
                    <ul>
                        <li data-zh="垂直于弦的直径平分这条弦，并且平分弦所对的两条弧。" 
                            data-en="The diameter perpendicular to a chord bisects the chord and the two arcs subtended by the chord."></li>
                    </ul>
                </div>
                <div class="card card-corollary">
                    <h3><span data-zh="📌 重要推论" data-en="📌 Corollary"></span></h3>
                    <p data-zh="1. 平分弦（不是直径）的直径垂直于弦，并且平分弦所对的两条弧；" 
                       data-en="1. The diameter that bisects a chord (not a diameter) is perpendicular to the chord and bisects the arcs subtended by the chord;"></p>
                    <p data-zh="2. 弦的垂直平分线经过圆心，并且平分弦所对的两条弧。" 
                       data-en="2. The perpendicular bisector of a chord passes through the center and bisects the arcs subtended by the chord."></p>
                </div>

                <div class="canvas-wrapper">
                    <div class="canvas-container">
                        <canvas id="geometryCanvas" width="880" height="400"></canvas>
                        
                        <div class="data-panel">
                            <div class="blue"><span data-zh="AH = BH = " data-en="AH = BH = "></span><span id="halfChord">0.000</span></div>
                            <div><span data-zh="弦长 AB = " data-en="Chord AB = "></span><span id="chordLength">0.000</span></div>
                            <div><span data-zh="半径 R = " data-en="Radius R = "></span><span id="radiusVal">1.000</span></div>
                            <hr>
                            <div class="green"><span data-zh="∠AHO = " data-en="∠AHO = "></span><span id="angleAHO">90</span>°</div>
                        </div>

                        <div class="control-bar">
                            <div class="control-left">
                                <label class="control-check">
                                    <input type="checkbox" id="showRightAngleCheck" checked> 
                                    <span data-zh="显示直角标记" data-en="Show right angle"></span>
                                </label>
                                <label class="control-check">
                                    <input type="checkbox" id="showRadiiCheck"> 
                                    <span data-zh="显示半径 OA、OB" data-en="Show radii OA, OB"></span>
                                </label>
                            </div>

                                <span data-zh="↻ 重置图形" data-en="↻ Reset"></span>
                            </button>
                        </div>
                    </div>
                    <p class="canvas-tip" data-zh="🔹 拖动弦端点 A 或 B · 直径 MN 自动垂直平分弦 AB · 直角标记和半径可开关" 
                       data-en="🔹 Drag chord endpoints A or B · Diameter MN automatically bisects AB perpendicularly · Toggle right angle & radii"></p>

<script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        const langBtn = document.getElementById('langToggleBtn');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        const halfChordSpan = document.getElementById('halfChord');
        const chordLengthSpan = document.getElementById('chordLength');
        const radiusSpan = document.getElementById('radiusVal');
        const angleAHOSpan = document.getElementById('angleAHO');
        
        const showRightAngleCheck = document.getElementById('showRightAngleCheck');
        const showRadiiCheck = document.getElementById('showRadiiCheck');

        // ---------- 全局变量 ----------
        let isChinese = true;
        const scale = 110;            
        const O = { x: 440, y: 200 };
        const r = 1;                 
        const rDraw = r * scale;
        
        let A, B, M, N, H;
        let isDragging = false;
        let dragTarget = null;        // 只拖动 A 或 B
        
        let showRightAngle = true;
        let showRadii = false;

        // 初始化位置
        function initPoints() {
            A = { x: O.x - 80, y: O.y + 60 };
            B = { x: O.x + 80, y: O.y + 60 };
            clampToCircle(A);
            clampToCircle(B);
            updateGeometry();
        }

        // 约束点在圆上
        function clampToCircle(p) {
            const dx = p.x - O.x;
            const dy = p.y - O.y;
            const d = Math.hypot(dx, dy);
            if (d < 0.1) return;
            p.x = O.x + dx / d * rDraw;
            p.y = O.y + dy / d * rDraw;
        }

        // 由弦AB计算垂直平分直径MN及中点H
        function updateGeometry() {
            clampToCircle(A);
            clampToCircle(B);
            
            // 中点H
            H = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
            
            // AB方向向量
            const abx = B.x - A.x;
            const aby = B.y - A.y;
            
            // 垂直方向 (MN)
            const mx = -aby;
            const my = abx;
            const len = Math.hypot(mx, my);
            
            M = { x: O.x - mx / len * rDraw, y: O.y - my / len * rDraw };
            N = { x: O.x + mx / len * rDraw, y: O.y + my / len * rDraw };
        }

        // 计算数据
        function getMetrics() {
            const half = Math.hypot(A.x - H.x, A.y - H.y) / scale;
            const chord = half * 2;
            return { half, chord };
        }

        // 绘制直角标记 (在H处，显示OA与AB垂直？实际上OH⊥AB，在H处画直角)
        function drawRightAngleAtH() {
            const size = 16;
            // 方向向量: HA 和 HO
            const hax = A.x - H.x;
            const hay = A.y - H.y;
            const hox = O.x - H.x;
            const hoy = O.y - H.y;
            
            const lenHA = Math.hypot(hax, hay);
            const lenHO = Math.hypot(hox, hoy);
            if (lenHA < 0.1 || lenHO < 0.1) return;
            
            const ux = hax / lenHA;
            const uy = hay / lenHA;
            const vx = hox / lenHO;
            const vy = hoy / lenHO;
            
            const p1 = { x: H.x + ux * size, y: H.y + uy * size };
            const p2 = { x: H.x + vx * size, y: H.y + vy * size };
            const p3 = { x: H.x + ux * size + vx * size, y: H.y + uy * size + vy * size };
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        // 绘制
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateGeometry();
            const { half, chord } = getMetrics();
            
            const isDark = document.body.classList.contains('dark-mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            const lineColor = isDark ? '#cbd5e1' : '#475569';
            
            // 绘制圆
            ctx.beginPath();
            ctx.arc(O.x, O.y, rDraw, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 绘制半径 OA, OB (可选)
            if (showRadii) {
                ctx.beginPath();
                ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y);
                ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // 绘制弦AB
            ctx.beginPath();
            ctx.moveTo(A.x, A.y);
            ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 绘制直径MN (虚线)
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(M.x, M.y);
            ctx.lineTo(N.x, N.y);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 2.0;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 绘制连线OH (点线)
            ctx.setLineDash([2, 3]);
            ctx.beginPath();
            ctx.moveTo(O.x, O.y);
            ctx.lineTo(H.x, H.y);
            ctx.strokeStyle = isDark ? '#a0aec0' : '#6b7280';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 直角标记 (可选)
            if (showRightAngle) {
                ctx.save();
                ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
                ctx.lineWidth = 2.2;
                drawRightAngleAtH();
                ctx.restore();
            }
            
            // 绘制点
            const drawPoint = (pt, radius, label, offsetX = 12, offsetY = 6) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(label, pt.x + offsetX, pt.y + offsetY);
            };
            
            drawPoint(O, 5, 'O', 12, 6);
            drawPoint(A, 7, 'A', 12, 6);
            drawPoint(B, 7, 'B', 12, 6);
            drawPoint(H, 5, 'H', 12, 6);
            drawPoint(M, 5, 'M', 12, 6);
            drawPoint(N, 5, 'N', 12, 6);
            
            // 更新面板
            halfChordSpan.textContent = half.toFixed(3);
            chordLengthSpan.textContent = chord.toFixed(3);
            radiusSpan.textContent = r.toFixed(3);
            angleAHOSpan.textContent = '90';  // 恒为90°
        }

        // ---------- 交互 ----------
        function getMouseCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function hitTest(x, y) {
            if (Math.hypot(x - A.x, y - A.y) < 20) return A;
            if (Math.hypot(x - B.x, y - B.y) < 20) return B;
            return null;
        }

        function onDragStart(e) {
            e.preventDefault();
            const coord = getMouseCoord(e);
            dragTarget = hitTest(coord.x, coord.y);
            if (dragTarget) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
            }
        }

        function onDragMove(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coord = getMouseCoord(e);
            dragTarget.x = coord.x;
            dragTarget.y = coord.y;
            draw();
        }

        function onDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                dragTarget = null;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function onHover(e) {
            if (isDragging) return;
            const coord = getMouseCoord(e);
            const target = hitTest(coord.x, coord.y);
            canvas.style.cursor = target ? 'grab' : 'default';
        }

        function resetToDefault() {
            initPoints();
            draw();
        }

        // ---------- 语言/主题 ----------
        function applyLanguage() {
            const i18nElements = document.querySelectorAll('[data-zh][data-en]');
            i18nElements.forEach(el => {
                el.textContent = isChinese ? el.dataset.zh : el.dataset.en;
            });
            langBtn.textContent = isChinese ? "English" : "中文";
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isChinese 
                ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
                : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
        }

        function toggleLanguage() {
            isChinese = !isChinese;
            applyLanguage();
            draw();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            updateThemeButtonText();
            draw();
        }

        // ---------- 绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mousemove', onHover);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            
            canvas.addEventListener('touchstart', onDragStart, { passive: false });
            canvas.addEventListener('touchmove', onDragMove, { passive: false });
            canvas.addEventListener('touchend', onDragEnd);
            canvas.addEventListener('touchcancel', onDragEnd);
            
            resetBtn.addEventListener('click', resetToDefault);
            langBtn.addEventListener('click', toggleLanguage);
            themeBtn.addEventListener('click', toggleTheme);
            
            showRightAngleCheck.addEventListener('change', (e) => {
                showRightAngle = e.target.checked;
                draw();
            });
            showRadiiCheck.addEventListener('change', (e) => {
                showRadii = e.target.checked;
                draw();
            });
            
            window.addEventListener('resize', () => draw());
        }

        // 启动
        applyLanguage();
        initPoints();
        bindEvents();
        draw();
    })();
</script>
	<script src="../colorblind.js"></script>
</body>
