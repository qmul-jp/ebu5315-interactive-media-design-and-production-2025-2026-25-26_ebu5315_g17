<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>08 · 弦切角定理 | CircleLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 + 响应式基础变量 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a; /* 修复无效色值 */
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            --animate-duration: 0.4s;
            --animate-ease: ease-out;
            --base-padding: 1.5rem;
            --base-font: 15px;
            --title-font: 24px;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            padding: calc(var(--header_height) + var(--base-padding)) 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
            font-size: var(--base-font);
        }

        /* 固定顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0.95rem;
            left: 1rem;
            right: 1rem;
            z-index: 999;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* 固定左侧导航栏 */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            bottom: 2rem;
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.24);
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem solid transparent;
            border-bottom: 0.38rem solid transparent;
            border-right: 0.38rem solid #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
        }

        .side_nav_link:hover .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* 主内容 */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: var(--title-font);
            font-weight: 600;
        }

        .content {
            padding: 32px 24px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            line-height: 1.6;
            transition: background-color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 191, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card p, .card li {
            font-size: var(--base-font);
            color: var(--text_secondary);
        }

        .canvas-wrapper {
            margin-top: 48px;
            padding: 24px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
            max-width: 100%;
            height: auto !important;
            display: block;
            margin: 0 auto;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }

        .control-left {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text_secondary);
            cursor: pointer;
        }

        .control-check input {
            width: 18px;
            height: 18px;
            accent-color: var(--sub_color);
            cursor: pointer;
        }

        .reset-btn {
            padding: 6px 14px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .data-panel {
            position: absolute;
            right: 16px;
            top: 16px;
            text-align: left;
            font-size: 15px;
            padding: 14px 18px;
            background: var(--card_bg);
            border-radius: 8px;
            box-shadow: var(--shadow_sm);
            border: 1px solid var(--border_light);
            color: var(--text_secondary);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .data-panel .blue { color: var(--sub_color); font-weight: 600; }
        .data-panel .green { color: var(--highlight_color); font-weight: 600; }
        .data-panel hr { margin: 8px 0; border: 0.5px solid var(--border_light); }

        .canvas-tip {
            margin-top: 16px;
            font-size: var(--base-font);
            color: var(--text_secondary);
            text-align: center;
        }

        body.dark-mode .card-def { background: #162349; }
        body.dark-mode .card-theorem { background: #14293f; }
        body.dark-mode .card-corollary { background: #2c2442; }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip,
        body.dark-mode .data-panel { color: var(--text_color_night); }

        /* ====================== 响应式适配 ====================== */
        /* 平板/横屏手机 */
        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
                color: #fff;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        /* 手机端 */
        @media (max-width: 768px) {
            :root {
                --header_height: 60px;
                --base-padding: 1rem;
                --title-font: 20px;
            }

            /* 顶部导航适配 */
            .navbar {
                padding: 0 0.8rem;
                top: 0.5rem;
                left: 0.5rem;
                right: 0.5rem;
            }
            .logo {
                font-size: 1.4rem;
            }
            .logo::before {
                width: 1.8rem;
                height: 1.8rem;
                font-size: 1rem;
            }
            .lang-toggle, .theme-toggle {
                padding: 0.4rem 0.6rem;
                font-size: 12px;
                min-height: 32px;
            }

            /* 内容区域适配 */
            .content {
                padding: 20px 16px;
            }
            .card h3 {
                font-size: 18px;
            }
            .canvas-wrapper {
                padding: 16px;
                margin-top: 32px;
            }

            /* 数据面板：移动端转为下方居中 */
            .data-panel {
                position: static;
                margin: 16px auto 0;
                text-align: center;
                max-width: 300px;
            }

            /* 控制栏垂直排列 */
            .control-bar {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .control-left {
                justify-content: center;
                width: 100%;
            }
        }

        /* 超小屏手机 */
        @media (max-width: 480px) {
            :root {
                --header_height: 52px;
                --base-font: 14px;
                --title-font: 18px;
            }

            .nav-buttons {
                gap: 0.3rem;
            }
            .content {
                padding: 16px 12px;
            }
            .canvas-tip {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h1>
                    <span data-zh="08 · 弦切角定理" data-en="08 · Tangent-Chord Angle Theorem"></span>
                </h1>
            </div>

            <div class="content">
                <div class="card card-def">
                    <h3><span data-zh="📘 基本定义" data-en="📘 Definition"></span></h3>
                    <p data-zh="顶点在圆上，一边与圆相切，另一边与圆相交的角叫做弦切角。" 
                       data-en="An angle with its vertex on a circle, one side tangent to the circle and the other side intersecting the circle is called a tangent-chord angle."></p>
                </div>
                <div class="card card-theorem">
                    <h3><span data-zh="📐 定理内容" data-en="📐 Theorem"></span></h3>
                    <p data-zh="<strong>在任意一个圆中：</strong>" data-en="<strong>In any circle:</strong>"></p>
                    <ul>
                        <li data-zh="弦切角等于它所夹的弧所对的圆周角。" 
                            data-en="The tangent-chord angle is equal to the inscribed angle subtended by the intercepted arc."></li>
                    </ul>
                </div>
                <div class="card card-corollary">
                    <h3><span data-zh="📌 重要推论" data-en="📌 Corollary"></span></h3>
                    <p data-zh="1. 弦切角的度数等于它所夹弧的度数的一半；" 
                       data-en="1. The measure of a tangent-chord angle equals half the measure of its intercepted arc;"></p>
                    <p data-zh="2. 同弧或等弧所对的弦切角相等。" 
                       data-en="2. Tangent-chord angles subtended by the same or equal arcs are equal."></p>
                </div>

                <div class="canvas-wrapper">
                    <div class="canvas-container">
                        <canvas id="geometryCanvas" width="880" height="400"></canvas>
                        
                        <div class="data-panel">
                            <div class="blue"><span data-zh="弦切角 ∠ABC = " data-en="Tangent-chord ∠ABC = "></span><span id="angleABC">0.0</span>°</div>
                            <div class="blue"><span data-zh="邻补角 ∠ABD = " data-en="Adjacent ∠ABD = "></span><span id="angleABD">0.0</span>°</div>
                            <div class="green"><span data-zh="圆周角 ∠AMB = " data-en="Inscribed ∠AMB = "></span><span id="angleAMB">0.0</span>°</div>
                        </div>

                        <div class="control-bar">
                            <div class="control-left">
                                <label class="control-check">
                                    <input type="checkbox" id="showRadiusCheck"> 
                                    <span data-zh="显示半径 OB" data-en="Show radius OB"></span>
                                </label>
                            </div>
                            <button class="reset-btn" id="resetBtn">
                                <span data-zh="↻ 重置图形" data-en="↻ Reset"></span>
                            </button>
                        </div>
                    </div>
                    <p class="canvas-tip" data-zh="🔹 拖动圆上点 A、B、M · 弦切角 ∠ABC = 圆周角 ∠AMB · 可切换辅助线" 
                       data-en="🔹 Drag A, B, M · ∠ABC = ∠AMB · Toggle helpers"></p>
                </div>
            </div>

<script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        const langBtn = document.getElementById('langToggleBtn');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        const angleABCspan = document.getElementById('angleABC');
        const angleABDspan = document.getElementById('angleABD');
        const angleAMBspan = document.getElementById('angleAMB');
        
        const showRadiusCheck = document.getElementById('showRadiusCheck');

        // ---------- 全局变量 ----------
        let isChinese = true;
        const scale = 130;
        const O = { x: 440, y: 200 };
        const rDraw = scale;
        
        let A, B, M, C, D;
        let isDragging = false;
        let dragTarget = null;
        
        let showRadius = false;

        // 初始化位置
        function initPoints() {
            A = { x: O.x - 100, y: O.y - 80 };
            B = { x: O.x + 100, y: O.y };
            M = { x: O.x + 80, y: O.y + 100 };
            clampToCircle(A);
            clampToCircle(B);
            clampToCircle(M);
            updateTangentLine();
        }

        function clampToCircle(p) {
            const dx = p.x - O.x;
            const dy = p.y - O.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 0.1) return;
            p.x = O.x + (dx / dist) * rDraw;
            p.y = O.y + (dy / dist) * rDraw;
        }

        // 更新B点处的切线CD（始终垂直于OB）
        function updateTangentLine() {
            const dx = B.x - O.x;
            const dy = B.y - O.y;
            const len = Math.hypot(dx, dy);
            const tx = -dy / len;
            const ty = dx / len;
            const tangentLength = 220;
            C = { x: B.x - tx * tangentLength, y: B.y - ty * tangentLength };
            D = { x: B.x + tx * tangentLength, y: B.y + ty * tangentLength };
        }

        // 计算三点夹角（middle为顶点）
        function angleBetween(p1, middle, p2) {
            const v1x = p1.x - middle.x, v1y = p1.y - middle.y;
            const v2x = p2.x - middle.x, v2y = p2.y - middle.y;
            const dot = v1x * v2x + v1y * v2y;
            const mod1 = Math.hypot(v1x, v1y);
            const mod2 = Math.hypot(v2x, v2y);
            return Math.acos(Math.max(-1, Math.min(1, dot / (mod1 * mod2)))) * 180 / Math.PI;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dragTarget) updateTangentLine();
            
            const isDark = document.body.classList.contains('dark-mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            
            // 圆
            ctx.beginPath();
            ctx.arc(O.x, O.y, rDraw, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 半径OB（可选）
            if (showRadius) {
                ctx.beginPath();
                ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
                ctx.strokeStyle = isDark ? '#a0aec0' : '#4b5563';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // 弦AB、BM、AM
            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
            ctx.moveTo(B.x, B.y); ctx.lineTo(M.x, M.y);
            ctx.moveTo(A.x, A.y); ctx.lineTo(M.x, M.y);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 切线CD（虚线）
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(C.x, C.y); ctx.lineTo(D.x, D.y);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 2.0;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 绘制点
            const drawPoint = (pt, radius, label, offX = 12, offY = 6) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(label, pt.x + offX, pt.y + offY);
            };
            
            drawPoint(O, 5, 'O', 12, 6);
            drawPoint(A, 7, 'A', 12, 6);
            drawPoint(B, 7, 'B', 12, 6);
            drawPoint(M, 7, 'M', 12, 6);
            drawPoint(C, 4, 'C', 10, 5);
            drawPoint(D, 4, 'D', 10, 5);
            
            // 更新角度
            const abc = angleBetween(A, B, C);
            const abd = 180 - abc;
            const amb = angleBetween(A, M, B);
            
            angleABCspan.textContent = abc.toFixed(1);
            angleABDspan.textContent = abd.toFixed(1);
            angleAMBspan.textContent = amb.toFixed(1);
        }

        // ---------- 交互 ----------
        function getCanvasCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function hitTest(x, y) {
            if (Math.hypot(x - A.x, y - A.y) < 18) return A;
            if (Math.hypot(x - B.x, y - B.y) < 18) return B;
            if (Math.hypot(x - M.x, y - M.y) < 18) return M;
            return null;
        }

        function onDragStart(e) {
            e.preventDefault();
            const coord = getCanvasCoord(e);
            dragTarget = hitTest(coord.x, coord.y);
            if (dragTarget) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
            }
        }

        function onDragMove(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coord = getCanvasCoord(e);
            dragTarget.x = coord.x;
            dragTarget.y = coord.y;
            clampToCircle(dragTarget);
            draw();
        }

        function onDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                dragTarget = null;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function onHover(e) {
            if (isDragging) return;
            const coord = getCanvasCoord(e);
            const target = hitTest(coord.x, coord.y);
            canvas.style.cursor = target ? 'grab' : 'default';
        }

        function resetToDefault() {
            initPoints();
            draw();
        }

        // ---------- 语言/主题 ----------
        function applyLanguage() {
            const i18n = document.querySelectorAll('[data-zh][data-en]');
            i18n.forEach(el => el.textContent = isChinese ? el.dataset.zh : el.dataset.en);
            langBtn.textContent = isChinese ? "English" : "中文";
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isChinese 
                ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
                : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
        }

        function toggleLanguage() {
            isChinese = !isChinese;
            applyLanguage();
            draw();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            updateThemeButtonText();
            draw();
        }

        // ---------- 绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mousemove', onHover);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            
            canvas.addEventListener('touchstart', onDragStart, { passive: false });
            canvas.addEventListener('touchmove', onDragMove, { passive: false });
            canvas.addEventListener('touchend', onDragEnd);
            canvas.addEventListener('touchcancel', onDragEnd);
            
            resetBtn.addEventListener('click', resetToDefault);
            langBtn.addEventListener('click', toggleLanguage);
            themeBtn.addEventListener('click', toggleTheme);
            
            showRadiusCheck.addEventListener('change', e => { showRadius = e.target.checked; draw(); });
            
            window.addEventListener('resize', () => draw());
        }

        applyLanguage();
        initPoints();
        bindEvents();
        draw();
    })();
</script>
	<script src="../colorblind.js"></script>
</body>
</html>
