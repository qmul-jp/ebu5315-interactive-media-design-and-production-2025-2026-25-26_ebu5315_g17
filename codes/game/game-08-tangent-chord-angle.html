        <main class="content_area">
            <div class="container">
                <div class="header">
                    <h1>
                        <span class="zh">08 - 弦切角定理</span>
                        <span class="en">08 - Tangent-Chord Angle Theorem</span>
                    </h1>
                </div>

                <div class="content">
                    <div class="canvas-container">
                        <canvas id="geometryCanvas" width="540" height="440"></canvas>
                    </div>

                    <div class="controls">
                        <button id="resetBtn" class="btn">重置</button>
                        <div class="checkbox-group">
                            <label>
                                <input type="checkbox" id="showRadiusCheck">
                                <span class="zh">显示半径</span>
                                <span class="en">Show Radius</span>
                            </label>
                        </div>
                    </div>

                    <div class="info">
                        <div class="angle-info">
                            <p>∠ABC: <span id="angleABC">45.0</span>°</p>
                            <p>∠ABD: <span id="angleABD">135.0</span>°</p>
                        </div>
                        <div class="angle-info">
                            <p>∠AMB: <span id="angleAMB">45.0</span>°</p>
                            <p>弦切角 = 所夹弧的圆周角</p>
                        </div>
                    </div>

                    <div class="theorem">
                        <h2>弦切角定理</h2>
                        <p>弦切角的度数等于所夹弧的度数的一半，也等于所夹弧所对的圆周角的度数。</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    (function(){
        "use strict";

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        
        const angleABCspan = document.getElementById('angleABC');
        const angleABDspan = document.getElementById('angleABD');
        const angleAMBspan = document.getElementById('angleAMB');
        
        const showRadiusCheck = document.getElementById('showRadiusCheck');

        // ---------- 全局变量 ----------
        const scale = 130;
        const O = { x: 440, y: 200 };
        const rDraw = scale;
        
        let A, B, M, C, D;
        let isDragging = false;
        let dragTarget = null;
        
        let showRadius = false;

        // 初始化位置
        function initPoints() {
            A = { x: O.x - 100, y: O.y - 80 };
            B = { x: O.x + 100, y: O.y };
            M = { x: O.x + 80, y: O.y + 100 };
            clampToCircle(A);
            clampToCircle(B);
            clampToCircle(M);
            updateTangentLine();
        }

        function clampToCircle(p) {
            const dx = p.x - O.x;
            const dy = p.y - O.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 0.1) return;
            p.x = O.x + (dx / dist) * rDraw;
            p.y = O.y + (dy / dist) * rDraw;
        }

        // 更新B点处的切线CD（始终垂直于OB）
        function updateTangentLine() {
            const dx = B.x - O.x;
            const dy = B.y - O.y;
            const len = Math.hypot(dx, dy);
            const tx = -dy / len;
            const ty = dx / len;
            const tangentLength = 220;
            C = { x: B.x - tx * tangentLength, y: B.y - ty * tangentLength };
            D = { x: B.x + tx * tangentLength, y: B.y + ty * tangentLength };
        }

        // 计算三点夹角（middle为顶点）
        function angleBetween(p1, middle, p2) {
            const v1x = p1.x - middle.x, v1y = p1.y - middle.y;
            const v2x = p2.x - middle.x, v2y = p2.y - middle.y;
            const dot = v1x * v2x + v1y * v2y;
            const mod1 = Math.hypot(v1x, v1y);
            const mod2 = Math.hypot(v2x, v2y);
            return Math.acos(Math.max(-1, Math.min(1, dot / (mod1 * mod2)))) * 180 / Math.PI;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dragTarget) updateTangentLine();
            
            const isDark = document.body.classList.contains('night_mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            
            // 圆
            ctx.beginPath();
            ctx.arc(O.x, O.y, rDraw, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 半径OB（可选）
            if (showRadius) {
                ctx.beginPath();
                ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y);
                ctx.strokeStyle = isDark ? '#a0aec0' : '#4b5563';
                ctx.lineWidth = 1.8;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // 弦AB、BM、AM
            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
            ctx.moveTo(B.x, B.y); ctx.lineTo(M.x, M.y);
            ctx.moveTo(A.x, A.y); ctx.lineTo(M.x, M.y);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 切线CD（虚线）
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(C.x, C.y); ctx.lineTo(D.x, D.y);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 2.0;
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 绘制点
            const drawPoint = (pt, radius, label, offX = 12, offY = 6) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(label, pt.x + offX, pt.y + offY);
            };
            
            drawPoint(O, 5, 'O', 12, 6);
            drawPoint(A, 7, 'A', 12, 6);
            drawPoint(B, 7, 'B', 12, 6);
            drawPoint(M, 7, 'M', 12, 6);
            drawPoint(C, 4, 'C', 10, 5);
            drawPoint(D, 4, 'D', 10, 5);
            
            // 更新角度
            const abc = angleBetween(A, B, C);
            const abd = 180 - abc;
            const amb = angleBetween(A, M, B);
            
            angleABCspan.textContent = abc.toFixed(1);
            angleABDspan.textContent = abd.toFixed(1);
            angleAMBspan.textContent = amb.toFixed(1);
        }

        // ---------- 交互 ----------
        function getCanvasCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function hitTest(x, y) {
            if (Math.hypot(x - A.x, y - A.y) < 18) return A;
            if (Math.hypot(x - B.x, y - B.y) < 18) return B;
            if (Math.hypot(x - M.x, y - M.y) < 18) return M;
            return null;
        }

        function onDragStart(e) {
            e.preventDefault();
            const coord = getCanvasCoord(e);
            dragTarget = hitTest(coord.x, coord.y);
            if (dragTarget) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
            }
        }

        function onDragMove(e) {
            if (!isDragging || !dragTarget) return;
            e.preventDefault();
            const coord = getCanvasCoord(e);
            dragTarget.x = coord.x;
            dragTarget.y = coord.y;
            clampToCircle(dragTarget);
            draw();
        }

        function onDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                dragTarget = null;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function onHover(e) {
            if (isDragging) return;
            const coord = getCanvasCoord(e);
            const target = hitTest(coord.x, coord.y);
            canvas.style.cursor = target ? 'grab' : 'default';
        }

        function resetToDefault() {
            initPoints();
            draw();
        }

        // ---------- 绑定 ----------
        function bindEvents() {
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mousemove', onHover);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            
            canvas.addEventListener('touchstart', onDragStart, { passive: false });
            canvas.addEventListener('touchmove', onDragMove, { passive: false });
            canvas.addEventListener('touchend', onDragEnd);
            canvas.addEventListener('touchcancel', onDragEnd);
            
            resetBtn.addEventListener('click', resetToDefault);
            
            showRadiusCheck.addEventListener('change', e => { showRadius = e.target.checked; draw(); });
            
            window.addEventListener('resize', () => draw());
        }

        initPoints();
        bindEvents();
        draw();
    })();
    </script>
