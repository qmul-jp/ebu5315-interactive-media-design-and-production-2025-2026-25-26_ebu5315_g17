<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>03 · 半圆直角定理 | CircleLab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 核心配色变量 — 与整体风格完全对齐 */
        :root {
            --theme_color: #0d3273;
            --sub_color: #4471c2;
            --highlight_color: #e8a0bf;
            --bg_color: #ffffff;
            --bg_color_night: #0f132a;
            --text_color: #102147;
            --text_color_night: #edf1ff;
            --panel_color: #f4f8ff;
            --panel_color_night: #1a234d;
            --line_color: rgba(68, 113, 194, 0.25);
            --shadow_soft: 0 16px 36px rgba(13, 50, 115, 0.14);
            --ui_radius: 0px;
            --rail_width: 92px;
            --header_height: 74px;
            
            --text_primary: #333333;
            --text_secondary: #666666;
            --text_tertiary: #888888;
            --card_bg: #ffffff;
            --border_light: #eeeeee;
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.12);

            --animate-duration: 0.4s;
            --animate-ease: ease-out;
        }

        /* 入场动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        /* 夜间模式变量覆盖 */
        body.dark-mode {
            --text_primary: var(--text_color_night);
            --text_secondary: #dddddd;
            --text_tertiary: #bbbbbb;
            --card_bg: var(--panel_color_night);
            --border_light: var(--line_color);
            --shadow_sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow_md: 0 4px 12px rgba(0,0,0,0.25);
            background: var(--bg_color_night);
            color: var(--text_color_night);
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            background: var(--bg_color);
            min-height: 100vh;
            color: var(--text_color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            padding: 0.95rem 1rem 2rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* ====================== 顶部导航栏 ====================== */
        .navbar {
            position: sticky;
            top: 0.95rem;
            z-index: 40;
            height: var(--header_height);
            padding: 0 1.15rem;
            background: var(--theme_color);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow_soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.55rem;
            opacity: 0;
            animation: fadeInDown var(--animate-duration) var(--animate-ease) forwards;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1;
        }

        .logo::before {
            content: "◯";
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-size: 1.2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .lang-toggle, .theme-toggle {
            min-height: 38px;
            padding: 0.45rem 0.9rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.34);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: transform 0.18s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border-radius: 0px;
        }

        .lang-toggle:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* ====================== 左侧边栏 ====================== */
        .side_nav {
            position: fixed;
            left: 1rem;
            top: calc(var(--header_height) + 1rem);
            bottom: 2rem;
            width: var(--rail_width);
            background: var(--sub_color);
            padding: 1.1rem 0.55rem;
            display: grid;
            align-content: start;
            justify-items: center;
            gap: 0.55rem;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.24);
            overflow: visible;
            z-index: 240;
            opacity: 0;
            animation: slideInLeft var(--animate-duration) var(--animate-ease) 0.1s forwards;
        }

        .side_nav_link {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 3.2rem;
            min-height: 3.2rem;
            padding: 0.35rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .side_nav_icon {
            width: 1.52rem;
            height: 1.52rem;
            display: grid;
            place-items: center;
        }

        .side_nav_icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-stroke;
        }

        .side_nav_tooltip {
            position: absolute;
            left: calc(100% + 0.72rem);
            top: 50%;
            transform: translate(-0.35rem, -50%);
            opacity: 0;
            pointer-events: none;
            background: #141414;
            color: #ffffff;
            font-size: 0.86rem;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
            padding: 0.52rem 0.64rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9999;
        }

        .side_nav_tooltip::before {
            content: "";
            position: absolute;
            left: -0.38rem;
            top: 50%;
            transform: translateY(-50%);
            border-top: 0.38rem solid transparent;
            border-bottom: 0.38rem solid transparent;
            border-right: 0.38rem solid #141414;
        }

        .side_nav_link:hover,
        .side_nav_link.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.42);
            transform: none;
        }

        .side_nav_link:hover .side_nav_tooltip,
        .side_nav_link:focus-visible .side_nav_tooltip {
            opacity: 1;
            transform: translate(0, -50%);
        }

        /* ====================== 主内容适配布局 ====================== */
        .main-wrapper {
            margin-left: calc(var(--rail_width) + 2.5rem);
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--rail_width) - 2.5rem);
            opacity: 0;
            animation: fadeInUp var(--animate-duration) var(--animate-ease) 0.2s forwards;
        }

        /* ====================== 页面卡片样式 ====================== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card_bg);
            border-radius: 12px;
            box-shadow: var(--shadow_md);
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, var(--theme_color), var(--sub_color));
            color: #fff;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 24px 20px;
        }

        .card {
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card-def {
            border-left: 4px solid var(--theme_color);
            background: rgba(13, 50, 115, 0.05);
        }
        .card-theorem {
            border-left: 4px solid var(--sub_color);
            background: rgba(68, 113, 194, 0.05);
        }
        .card-corollary {
            border-left: 4px solid var(--highlight_color);
            background: rgba(232, 160, 194, 0.05);
        }

        .card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .card p, .card li {
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .card ul {
            padding-left: 20px;
        }

        /* 画布区域 */
        .canvas-wrapper {
            position: relative;
            text-align: center;
            margin-top: 24px;
            padding: 16px;
            background: var(--card_bg);
            border: 1px solid var(--border_light);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            background: var(--card_bg);
            border-radius: 6px;
            touch-action: none;
            border: 1px solid var(--border_light);
            transition: all 0.3s ease;
            display: block;
        }

        .reset-btn {
            position: absolute;
            left: 10px;
            bottom: 10px;
            padding: 6px 12px;
            background: var(--theme_color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            font-weight: 600;
        }
        .reset-btn:hover {
            background: var(--sub_color);
        }

        .data-panel {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translate(30px, -50%);
            text-align: left;
            font-size: 15px;
            line-height: 1.8;
            min-width: 180px;
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text_secondary);
            pointer-events: none;
        }
        .data-panel .blue { 
            color: var(--sub_color); 
            font-weight: 600; 
        }

        .canvas-tip {
            margin-top: 12px;
            font-size: 15px;
            color: var(--text_secondary);
            line-height: 1.4;
        }

        /* 夜间模式卡片微调 */
        body.dark-mode .card-def {
            background: #162349;
            color: var(--text_color_night);
        }
        body.dark-mode .card-theorem {
            background: #14293f;
            color: var(--text_color_night);
        }
        body.dark-mode .card-corollary {
            background: #2c2442;
            color: var(--text_color_night);
        }
        body.dark-mode .card p, 
        body.dark-mode .card li,
        body.dark-mode .canvas-tip,
        body.dark-mode .data-panel {
            color: var(--text_color_night);
        }

        /* 响应式适配 */
        @media (max-width: 980px) {
            .side_nav {
                position: sticky;
                top: calc(var(--header_height) + 0.4rem);
                min-height: auto;
                grid-template-columns: repeat(3, 1fr);
                align-items: center;
                justify-items: stretch;
                padding: 0.35rem;
                width: 100%;
                left: 0;
                bottom: auto;
            }
            .side_nav_link {
                width: 100%;
                min-height: auto;
                padding: 0.42rem 0.2rem;
                flex-direction: column;
                gap: 0.2rem;
            }
            .side_nav_tooltip {
                position: static;
                transform: none;
                opacity: 1;
                background: transparent;
                box-shadow: none;
                padding: 0;
                font-size: 0.78rem;
                color: #fff;
            }
            .side_nav_tooltip::before { display: none; }
            .main-wrapper {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .data-panel {
                position: static;
                transform: none;
                margin-top: 16px;
                text-align: center;
            }
            .canvas-container {
                width: 100%;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

                <h1 data-zh="03 · 半圆直角定理" data-en="03 · Semicircle Right Angle Theorem"></h1>
            </div>

            <div class="content">
                <!-- 定义卡片 -->
                <div class="card card-def">
                    <h3 data-zh="📘 基本定义" data-en="📘 Definition"></h3>
                    <p data-zh="顶点在圆上，两边与圆相交的角，叫做圆周角。" data-en="An inscribed angle is an angle formed by two chords in a circle with the vertex on the circle."></p>
                </div>

                <!-- 定理卡片 -->
                <div class="card card-theorem">
                    <h3 data-zh="📐 定理内容" data-en="📐 Theorem"></h3>
                    <p data-zh="在任意一个圆中：" data-en="In any circle:"></p>
                    <ul>
                        <li data-zh="半圆（直径）所对的圆周角一定是直角" data-en="The inscribed angle of a semicircle is always a right angle"></li>
                        <li data-zh="直径所对的圆周角恒等于 90°" data-en="The inscribed angle subtended by a diameter is always 90°"></li>
                    </ul>
                </div>

                <!-- 推论卡片 -->
                <div class="card card-corollary">
                    <h3 data-zh="📌 重要推论" data-en="📌 Corollary"></h3>
                    <p data-zh="如果三角形的一条边是圆的直径，且第三个顶点在圆上，该三角形一定是直角三角形。" data-en="If one side of a triangle is the diameter of a circle and the third vertex lies on the circle, the triangle must be a right triangle."></p>
                </div>

                <!-- 交互画布区 -->
                <div class="canvas-wrapper">
                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>
                        <button class="reset-btn" id="resetBtn" data-zh="↻ 重置图形" data-en="↻ Reset"></button>
                        <div class="data-panel">
                            <div class="blue">
                                <span data-zh="∠ACB：" data-en="∠ACB："></span>
                                <span id="ang1">90</span>°
                            </div>
                            <div style="font-size: 0.9rem; opacity:0.8; margin-top: 6px;" data-zh="(直径所对圆周角)" data-en="(inscribed angle of diameter)"></div>
                        </div>
                    </div>
                    <p class="canvas-tip" data-zh="🔹 拖动 A、B、C · 点标记在圆周上，标签显示在圆外侧 · 直角时出现垂直符号" data-en="🔹 Drag A, B, C · Labels are placed outside the circle · Right angle symbol appears at 90°"></p>

    <script>
        (function(){
            "use strict";

            // ---------- 国际化 & 主题 ----------
            let isChinese = true;
            const langBtn = document.getElementById('langToggleBtn');
            const themeBtn = document.getElementById('themeToggleBtn');
            
            function applyLanguage() {
                const i18nElements = document.querySelectorAll('[data-zh][data-en]');
                i18nElements.forEach(el => {
                    el.textContent = isChinese ? el.dataset.zh : el.dataset.en;
                });
                langBtn.textContent = isChinese ? "English" : "中文";
                updateThemeButtonText();
            }

            function updateThemeButtonText() {
                const isDark = document.body.classList.contains('dark-mode');
                themeBtn.textContent = isChinese 
                    ? (isDark ? "☀️ 白天模式" : "🌙 夜间模式")
                    : (isDark ? "☀️ Light Mode" : "🌙 Dark Mode");
            }

            function toggleLanguage() {
                isChinese = !isChinese;
                applyLanguage();
                draw();
            }

            function toggleTheme() {
                document.body.classList.toggle('dark-mode');
                updateThemeButtonText();
                draw();
            }

            langBtn.addEventListener('click', toggleLanguage);
            themeBtn.addEventListener('click', toggleTheme);
            
            applyLanguage();

            // ---------- 画布与几何参数 ----------
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const resetBtn = document.getElementById('resetBtn');
            const angleSpan = document.getElementById('ang1');

            const cx = 270, cy = 220;       
            const radius = 160;              
            const diamRight = 0;             
            const diamLeft = Math.PI;        
            const snapThreshold = 0.05;      

            // 标签外移距离 (沿半径方向)
            const LABEL_OFFSET = 22;          

            const initialPoints = {
                A: { angle: diamLeft },
                B: { angle: diamRight },
                C: { angle: 3 * Math.PI / 2 }
            };

            let points = {
                A: { angle: diamLeft },
                B: { angle: diamRight },
                C: { angle: 3 * Math.PI / 2 }
            };

            let dragging = null;
            let hoverPoint = null;

            // 获取圆周上的坐标
            function getPosition(angle) {
                return {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                };
            }

            // 获取标签坐标 (沿半径向外偏移)
            function getLabelPosition(angle, offset = LABEL_OFFSET) {
                const dirX = Math.cos(angle);
                const dirY = Math.sin(angle);
                return {
                    x: cx + (radius + offset) * dirX,
                    y: cy + (radius + offset) * dirY
                };
            }

            // 吸附至直径端点
            function snapToDiameter(angle) {
                let a = angle;
                while (a < 0) a += 2 * Math.PI;
                a = a % (2 * Math.PI);
                
                const distToRight = Math.min(Math.abs(a - 0), 2*Math.PI - Math.abs(a - 0));
                const distToLeft = Math.min(Math.abs(a - Math.PI), 2*Math.PI - Math.abs(a - Math.PI));
                
                if (distToRight < snapThreshold) return 0;
                if (distToLeft < snapThreshold) return Math.PI;
                return angle;
            }

            // 绘制直角符号 (仅当角度≈90°)
            function drawRightAngleSymbol(C, A, B) {
                const size = 16;
                const u = { x: A.x - C.x, y: A.y - C.y };
                const v = { x: B.x - C.x, y: B.y - C.y };
                const lenU = Math.hypot(u.x, u.y);
                const lenV = Math.hypot(v.x, v.y);
                if (lenU < 0.001 || lenV < 0.001) return;
                
                const ux = u.x / lenU;
                const uy = u.y / lenU;
                const vx = v.x / lenV;
                const vy = v.y / lenV;
                
                const p1 = { x: C.x + ux * size, y: C.y + uy * size };
                const p2 = { x: C.x + vx * size, y: C.y + vy * size };
                const p1v = { x: p1.x + vx * size, y: p1.y + vy * size };
                const p2u = { x: p2.x + ux * size, y: p2.y + uy * size };
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p1v.x, p1v.y);
                ctx.lineTo(p2u.x, p2u.y);
                ctx.lineTo(p2.x, p2.y);
                
                const isDark = document.body.classList.contains('dark-mode');
                ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
                ctx.lineWidth = 2.0;
                ctx.stroke();
            }

            // 主绘制函数
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const isDark = document.body.classList.contains('dark-mode');
                const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
                const fillColor = isDark ? '#f8fafc' : '#0f172a';
                const dashColor = isDark ? '#94a3b8' : '#64748b';
                
                // 圆
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.2;
                ctx.stroke();
                
                // 直径虚线
                ctx.save();
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(cx - radius, cy);
                ctx.lineTo(cx + radius, cy);
                ctx.strokeStyle = dashColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
                
                // 圆心
                ctx.beginPath();
                ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.font = '500 15px "Segoe UI", "Trebuchet MS", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText('O', cx, cy - 18);
                
                // 各点坐标
                const pos = {
                    A: getPosition(points.A.angle),
                    B: getPosition(points.B.angle),
                    C: getPosition(points.C.angle)
                };
                
                // 连线 AC, BC
                ctx.beginPath();
                ctx.moveTo(pos.A.x, pos.A.y);
                ctx.lineTo(pos.C.x, pos.C.y);
                ctx.lineTo(pos.B.x, pos.B.y);
                ctx.strokeStyle = isDark ? '#cbd5e1' : '#475569';
                ctx.lineWidth = 1.8;
                ctx.stroke();
                
                // 计算角度
                let arcAB = Math.abs(points.B.angle - points.A.angle);
                if (arcAB > Math.PI) arcAB = 2 * Math.PI - arcAB;
                const degC = Math.round(arcAB / 2 * 180 / Math.PI);
                angleSpan.textContent = degC;
                
                // 直角判定并绘制符号
                const isRightAngle = Math.abs(degC - 90) < 0.6;
                if (isRightAngle) {
                    drawRightAngleSymbol(pos.C, pos.A, pos.B);
                }
                
                // 绘制圆周上的点标记 (小圆)
                const keys = ['A', 'B', 'C'];
                keys.forEach(k => {
                    const p = pos[k];
                    ctx.beginPath();
                    const pointRadius = (hoverPoint === k) ? 9 : 7;
                    ctx.arc(p.x, p.y, pointRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = fillColor;
                    ctx.shadowColor = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                
                // ★ 关键修改：标签文字绘制在圆周外侧 (沿径向向外偏移)
                keys.forEach(k => {
                    const angle = points[k].angle;
                    const labelPos = getLabelPosition(angle);
                    
                    ctx.font = 'bold 17px "Segoe UI", "Trebuchet MS", sans-serif';
                    ctx.fillStyle = fillColor;
                    ctx.fillText(k, labelPos.x, labelPos.y);
                });
            }

            // ---------- 鼠标交互 ----------
            function getCanvasMouse(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                return { x: mouseX, y: mouseY };
            }

            function hitTest(mx, my) {
                const threshold = 20;
                for (let key of ['A', 'B', 'C']) {
                    const p = getPosition(points[key].angle);
                    const dist = Math.hypot(mx - p.x, my - p.y);
                    if (dist < threshold) return key;
                }
                return null;
            }

            function onMouseDown(e) {
                const m = getCanvasMouse(e);
                dragging = hitTest(m.x, m.y);
                if (dragging) {
                    canvas.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            }

            function onMouseMove(e) {
                const m = getCanvasMouse(e);
                
                if (!dragging) {
                    hoverPoint = hitTest(m.x, m.y);
                    canvas.style.cursor = hoverPoint ? 'grab' : 'default';
                    draw();
                    return;
                }
                
                let angle = Math.atan2(m.y - cy, m.x - cx);
                if (dragging === 'A' || dragging === 'B') {
                    angle = snapToDiameter(angle);
                }
                points[dragging].angle = angle;
                draw();
            }

            function onMouseUp(e) {
                if (dragging) {
                    dragging = null;
                    canvas.style.cursor = 'default';
                    draw();
                }
            }

            function onMouseLeave() {
                hoverPoint = null;
                if (!dragging) {
                    canvas.style.cursor = 'default';
                }
                draw();
            }

            function resetPoints() {
                points = {
                    A: { angle: initialPoints.A.angle },
                    B: { angle: initialPoints.B.angle },
                    C: { angle: initialPoints.C.angle }
                };
                draw();
            }

            // 事件绑定
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseLeave);
            resetBtn.addEventListener('click', resetPoints);

            // 触摸屏支持
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
                const m = getCanvasMouse(fakeMouse);
                dragging = hitTest(m.x, m.y);
                if (dragging) canvas.style.cursor = 'grabbing';
            }, { passive: false });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!dragging) return;
                const touch = e.touches[0];
                const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
                const m = getCanvasMouse(fakeMouse);
                let angle = Math.atan2(m.y - cy, m.x - cx);
                if (dragging === 'A' || dragging === 'B') {
                    angle = snapToDiameter(angle);
                }
                points[dragging].angle = angle;
                draw();
            }, { passive: false });
            
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                dragging = null;
                canvas.style.cursor = 'default';
                draw();
            });

            window.addEventListener('resize', () => { draw(); });
            draw();
        })();
    </script>
</body>
</html>
