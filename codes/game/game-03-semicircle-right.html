        <main class="content_area">

                <div class="header">

                        <span class="en">03 - Semicircle Right Angle Theorem</span>
                    </h1>
                </div>

                <div class="content">
                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>
                    </div>

                    <div class="controls">
                        <button id="resetBtn" class="btn">重置</button>
                    </div>

                        <div class="angle-info">
                            <p>∠ACB: <span id="ang1">90</span>°</p>
                        </div>
                    </div>

                    <div class="theorem">
                        <h2>半圆直角定理</h2>
                        <p>半圆所对的圆周角是直角。</p>
                    </div>
                </div>

    <script>
        // ==================== 半圆直角定理画布逻辑 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');
        const angleSpan = document.getElementById('ang1');

        const cx = 270, cy = 220;       
        const radius = 160;              
        const diamRight = 0;              
        const diamLeft = Math.PI;        
        const snapThreshold = 0.05;      

        // 标签外移距离 (沿半径方向)
        const LABEL_OFFSET = 22;          

        const initialPoints = {
            A: { angle: diamLeft },
            B: { angle: diamRight },
            C: { angle: 3 * Math.PI / 2 }
        };

        let points = {
            A: { angle: diamLeft },
            B: { angle: diamRight },
            C: { angle: 3 * Math.PI / 2 }
        };

        let dragging = null;
        let hoverPoint = null;

        // 获取圆周上的坐标
        function getPosition(angle) {
            return {
                x: cx + radius * Math.cos(angle),
                y: cy + radius * Math.sin(angle)
            };
        }

        // 获取标签坐标 (沿半径向外偏移)
        function getLabelPosition(angle, offset = LABEL_OFFSET) {
            const dirX = Math.cos(angle);
            const dirY = Math.sin(angle);
            return {
                x: cx + (radius + offset) * dirX,
                y: cy + (radius + offset) * dirY
            };
        }

        // 吸附至直径端点
        function snapToDiameter(angle) {
            let a = angle;
            while (a < 0) a += 2 * Math.PI;
            a = a % (2 * Math.PI);
            
            const distToRight = Math.min(Math.abs(a - 0), 2*Math.PI - Math.abs(a - 0));
            const distToLeft = Math.min(Math.abs(a - Math.PI), 2*Math.PI - Math.abs(a - Math.PI));
            
            if (distToRight < snapThreshold) return 0;
            if (distToLeft < snapThreshold) return Math.PI;
            return angle;
        }

        // 绘制直角符号 (仅当角度≈90°)
        function drawRightAngleSymbol(C, A, B) {
            const size = 16;
            const u = { x: A.x - C.x, y: A.y - C.y };
            const v = { x: B.x - C.x, y: B.y - C.y };
            const lenU = Math.hypot(u.x, u.y);
            const lenV = Math.hypot(v.x, v.y);
            if (lenU < 0.001 || lenV < 0.001) return;
            
            const ux = u.x / lenU;
            const uy = u.y / lenU;
            const vx = v.x / lenV;
            const vy = v.y / lenV;
            
            const p1 = { x: C.x + ux * size, y: C.y + uy * size };
            const p2 = { x: C.x + vx * size, y: C.y + vy * size };
            const p1v = { x: p1.x + vx * size, y: p1.y + vy * size };
            const p2u = { x: p2.x + ux * size, y: p2.y + uy * size };
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p1v.x, p1v.y);
            ctx.lineTo(p2u.x, p2u.y);
            ctx.lineTo(p2.x, p2.y);
            
            const isDark = document.body.classList.contains('night_mode');
            ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
            ctx.lineWidth = 2.0;
            ctx.stroke();
        }

        // 主绘制函数
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const isDark = document.body.classList.contains('night_mode');
            const strokeColor = isDark ? '#e2e8f0' : '#1e293b';
            const fillColor = isDark ? '#f8fafc' : '#0f172a';
            const dashColor = isDark ? '#94a3b8' : '#64748b';
            
            // 圆
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            
            // 直径虚线
            ctx.save();
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(cx - radius, cy);
            ctx.lineTo(cx + radius, cy);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
            
            // 圆心
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.font = '500 15px "Segoe UI", "Trebuchet MS", sans-serif';
            ctx.fillStyle = fillColor;
            ctx.fillText('O', cx, cy - 18);
            
            // 各点坐标
            const pos = {
                A: getPosition(points.A.angle),
                B: getPosition(points.B.angle),
                C: getPosition(points.C.angle)
            };
            
            // 连线 AC, BC
            ctx.beginPath();
            ctx.moveTo(pos.A.x, pos.A.y);
            ctx.lineTo(pos.C.x, pos.C.y);
            ctx.lineTo(pos.B.x, pos.B.y);
            ctx.strokeStyle = isDark ? '#cbd5e1' : '#475569';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 计算角度
            let arcAB = Math.abs(points.B.angle - points.A.angle);
            if (arcAB > Math.PI) arcAB = 2 * Math.PI - arcAB;
            const degC = Math.round(arcAB / 2 * 180 / Math.PI);
            angleSpan.textContent = degC;
            
            // 直角判定并绘制符号
            const isRightAngle = Math.abs(degC - 90) < 0.6;
            if (isRightAngle) {
                drawRightAngleSymbol(pos.C, pos.A, pos.B);
            }
            
            // 绘制圆周上的点标记 (小圆)
            const keys = ['A', 'B', 'C'];
            keys.forEach(k => {
                const p = pos[k];
                ctx.beginPath();
                const pointRadius = (hoverPoint === k) ? 9 : 7;
                ctx.arc(p.x, p.y, pointRadius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.shadowColor = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // 标签文字绘制在圆周外侧 (沿径向向外偏移)
            keys.forEach(k => {
                const angle = points[k].angle;
                const labelPos = getLabelPosition(angle);
                
                ctx.font = 'bold 17px "Segoe UI", "Trebuchet MS", sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText(k, labelPos.x, labelPos.y);
            });
        }

        // 鼠标交互
        function getCanvasMouse(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            return { x: mouseX, y: mouseY };
        }

        function hitTest(mx, my) {
            const threshold = 20;
            for (let key of ['A', 'B', 'C']) {
                const p = getPosition(points[key].angle);
                const dist = Math.hypot(mx - p.x, my - p.y);
                if (dist < threshold) return key;
            }
            return null;
        }

        function onMouseDown(e) {
            const m = getCanvasMouse(e);
            dragging = hitTest(m.x, m.y);
            if (dragging) {
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }

        function onMouseMove(e) {
            const m = getCanvasMouse(e);
            
            if (!dragging) {
                hoverPoint = hitTest(m.x, m.y);
                canvas.style.cursor = hoverPoint ? 'grab' : 'default';
                draw();
                return;
            }
            
            let angle = Math.atan2(m.y - cy, m.x - cx);
            if (dragging === 'A' || dragging === 'B') {
                angle = snapToDiameter(angle);
            }
            points[dragging].angle = angle;
            draw();
        }

        function onMouseUp(e) {
            if (dragging) {
                dragging = null;
                canvas.style.cursor = 'default';
                draw();
            }
        }

        function onMouseLeave() {
            hoverPoint = null;
            if (!dragging) {
                canvas.style.cursor = 'default';
            }
            draw();
        }

        function resetPoints() {
            points = {
                A: { angle: initialPoints.A.angle },
                B: { angle: initialPoints.B.angle },
                C: { angle: initialPoints.C.angle }
            };
            draw();
        }

        // 事件绑定
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseLeave);
        resetBtn.addEventListener('click', resetPoints);

        // 触摸屏支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
            const m = getCanvasMouse(fakeMouse);
            dragging = hitTest(m.x, m.y);
            if (dragging) canvas.style.cursor = 'grabbing';
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!dragging) return;
            const touch = e.touches[0];
            const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
            const m = getCanvasMouse(fakeMouse);
            let angle = Math.atan2(m.y - cy, m.x - cx);
            if (dragging === 'A' || dragging === 'B') {
                angle = snapToDiameter(angle);
            }
            points[dragging].angle = angle;
            draw();
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            dragging = null;
            canvas.style.cursor = 'default';
            draw();
        });

        // 初始化
        window.addEventListener('resize', () => { draw(); });
        draw();
    </script>
