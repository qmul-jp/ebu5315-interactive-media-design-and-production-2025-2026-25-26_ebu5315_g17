        <main class="content_area">

                <div class="header">
                    <h1>
                        <span class="zh">02 - 同弧圆周角定理</span>
                        <span class="en">02 - Inscribed Angle Theorem</span>
                    </h1>
                </div>

                <div class="content">
                    <div class="canvas-container">
                        <canvas id="canvas" width="540" height="440"></canvas>
                    </div>

                    <div class="controls">
                        <button id="resetBtn" class="btn">重置</button>
                        <button id="arcToggleBtn" class="btn">
                            <span class="zh">切换为优弧</span>
                            <span class="en">Switch to Major</span>
                        </button>
                    </div>

                    <div class="info">
                        <div class="angle-info">
                            <p>∠ACB: <span id="ang1">30</span>°</p>
                            <p>
                                <span id="arcLabelZh">劣弧AB</span>: 
                                <span id="arc1">1.05</span>
                            </p>
                        </div>
                    </div>

                    <div class="theorem">
                        <h2>同弧圆周角定理</h2>
                        <p>在同圆或等圆中，同弧所对的圆周角相等，且等于该弧所对圆心角的一半。</p>
                    </div>
                </div>
            </div>
        </main>

    <script>
        // ==================== 同弧圆周角定理画布逻辑 ====================
        let showMinorArc = true;

        function updateArcLabels() {
            document.getElementById('arcLabelZh').textContent = showMinorArc ? '劣弧AB' : '优弧AB';
        }

        function updateArcBtnText() {
            const btn = document.getElementById('arcToggleBtn');
            const zhText = showMinorArc ? '切换为优弧' : '切换为劣弧';
            const enText = showMinorArc ? 'Switch to Major' : 'Switch to Minor';
            
            btn.querySelector('.zh').textContent = zhText;
            btn.querySelector('.en').textContent = enText;
        }

        // 弧切换按钮事件
        document.getElementById('arcToggleBtn').addEventListener('click', () => {
            showMinorArc = !showMinorArc;
            updateArcLabels();
            updateArcBtnText();
            draw();
        });

        // ==================== 画布交互逻辑 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        const cx = 270, cy = 220;
        const radius = 160;
        const diamRightAngle = 0;
        const diamLeftAngle = Math.PI;
        const snapDistance = 8;

        const initialPoints = {
            A: { angle: Math.PI / 3 },
            B: { angle: 2 * Math.PI / 3 },
            C: { angle: 3 * Math.PI / 2 }
        };

        let points = JSON.parse(JSON.stringify(initialPoints));
        let dragging = null;
        let hoverPoint = null;

        function getPosition(angle) {
            return {
                x: cx + radius * Math.cos(angle),
                y: cy + radius * Math.sin(angle)
            };
        }

        function snapAngle(angle) {
            const dRight = Math.abs(angle - diamRightAngle);
            const dLeft = Math.abs(angle - diamLeftAngle);
            const snapRad = snapDistance / radius;
            if (dRight < snapRad) return diamRightAngle;
            if (dLeft < snapRad) return diamLeftAngle;
            return angle;
        }

        // 直角符号代码
        function drawRightAngleSymbol(C, A, B) {
            const size = 16;
            const u = { x: A.x - C.x, y: A.y - C.y };
            const v = { x: B.x - C.x, y: B.y - C.y };
            const lenU = Math.hypot(u.x, u.y);
            const lenV = Math.hypot(v.x, v.y);
            if (lenU < 0.001 || lenV < 0.001) return;
            
            const ux = u.x / lenU;
            const uy = u.y / lenU;
            const vx = v.x / lenV;
            const vy = v.y / lenV;
            
            const p1 = { x: C.x + ux * size, y: C.y + uy * size };
            const p2 = { x: C.x + vx * size, y: C.y + vy * size };
            const p1v = { x: p1.x + vx * size, y: p1.y + vy * size };
            const p2u = { x: p2.x + ux * size, y: p2.y + uy * size };
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p1v.x, p1v.y);
            ctx.lineTo(p2u.x, p2u.y);
            ctx.lineTo(p2.x, p2.y);
            
            const isDark = document.body.classList.contains('night_mode');
            ctx.strokeStyle = isDark ? '#f1f5f9' : '#1e293b';
            ctx.lineWidth = 2.0;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const isDark = document.body.classList.contains('night_mode');
            const strokeColor = isDark ? '#e5e7eb' : '#333';
            const fillColor = isDark ? '#e5e7eb' : '#000';
            const dashColor = isDark ? '#94a3b8' : '#999';

            // 绘制圆
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制直径虚线
            ctx.save();
            ctx.setLineDash([5, 3]);
            ctx.strokeStyle = dashColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx - radius, cy);
            ctx.lineTo(cx + radius, cy);
            ctx.stroke();
            ctx.restore();

            // 圆心
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.font = '16px Arial';
            ctx.fillText('O', cx, cy - 18);

            // 获取点坐标
            const pos = {
                A: getPosition(points.A.angle),
                B: getPosition(points.B.angle),
                C: getPosition(points.C.angle)
            };

            // 绘制弦
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = isDark ? '#94a3b8' : '#666';
            ctx.beginPath(); ctx.moveTo(pos.A.x, pos.A.y); ctx.lineTo(pos.C.x, pos.C.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pos.B.x, pos.B.y); ctx.lineTo(pos.C.x, pos.C.y); ctx.stroke();

            // 计算角度
            let minorArcAB = Math.abs(points.B.angle - points.A.angle);
            if (minorArcAB > Math.PI) minorArcAB = 2 * Math.PI - minorArcAB;
            const arcAB = showMinorArc ? minorArcAB : 2 * Math.PI - minorArcAB;
            const angleC = minorArcAB / 2;
            const degC = Math.round(angleC * 180 / Math.PI);

            // 直角符号显示
            const isRightAngle = Math.abs(degC - 90) < 0.6;
            if (isRightAngle) {
                drawRightAngleSymbol(pos.C, pos.A, pos.B);
            }

            // 绘制点
            for (const k in pos) {
                ctx.beginPath();
                ctx.arc(pos[k].x, pos[k].y, hoverPoint === k ? 8 : 7, 0, Math.PI * 2);
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.font = '18px Arial';
                ctx.fillText(k, pos[k].x, pos[k].y - 18);
            }

            // 更新数据
            document.getElementById('ang1').textContent = degC + '°';
            document.getElementById('arc1').textContent = arcAB.toFixed(2);
        }

        // 鼠标交互
        function getMousePos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function checkHit(mx, my) {
            for (const k in points) {
                const p = getPosition(points[k].angle);
                if (Math.hypot(mx - p.x, my - p.y) < 16) return k;
            }
            return null;
        }

        canvas.addEventListener('mousedown', (e) => {
            const m = getMousePos(e);
            dragging = checkHit(m.x, m.y);
            if (dragging) canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragging) {
                const m = getMousePos(e);
                hoverPoint = checkHit(m.x, m.y);
                canvas.style.cursor = hoverPoint ? 'grab' : 'default';
                draw();
                return;
            }
            const m = getMousePos(e);
            const rawAngle = Math.atan2(m.y - cy, m.x - cx);
            points[dragging].angle = snapAngle(rawAngle);
            draw();
        });

        window.addEventListener('mouseup', () => {
            dragging = null;
            canvas.style.cursor = hoverPoint ? 'grab' : 'default';
        });

        canvas.addEventListener('mouseleave', () => {
            hoverPoint = null;
            draw();
        });

        // 重置按钮
        resetBtn.onclick = () => {
            points = JSON.parse(JSON.stringify(initialPoints));
            showMinorArc = true;
            updateArcLabels();
            updateArcBtnText();
            draw();
        };

        // 触摸屏支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
            const m = getMousePos(fakeMouse);
            dragging = checkHit(m.x, m.y);
            if (dragging) canvas.style.cursor = 'grabbing';
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!dragging) return;
            const touch = e.touches[0];
            const fakeMouse = { clientX: touch.clientX, clientY: touch.clientY };
            const m = getMousePos(fakeMouse);
            let angle = Math.atan2(m.y - cy, m.x - cx);
            points[dragging].angle = snapAngle(angle);
            draw();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            dragging = null;
            canvas.style.cursor = 'default';
            draw();
        });

        // 初始化
        updateArcLabels();
        updateArcBtnText();
        draw();
    </script>
